<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>BBSUTSD Campus Map &amp; Complexes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #google-map, #leaflet-map {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }
    #leaflet-map {
      display: none;
    }

    /* Pulsing live Pixel Cobalt GPS dot */
    .gps-dot-wrapper {
      position: relative;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .gps-dot-pulse {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(11, 87, 208, 0.28);
      animation: gpsPulse 1.8s ease-out infinite;
    }
    .gps-dot-core {
      position: relative;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0B57D0;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(11, 87, 208, 0.45);
    }
    @keyframes gpsPulse {
      0% { transform: scale(0.8); opacity: 0.95; }
      70% { transform: scale(2.2); opacity: 0; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* Complex & Dividing Road Badges — Minimalist Pixel Pills */
    .zone-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 9999px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.35px;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.14);
    }
    .zone-badge.is-leaflet {
      transform: none;
      margin-left: -50%;
      margin-top: -50%;
    }
    .zone-badge-old {
      background: rgba(255, 255, 255, 0.96);
      color: #B3261E;
      border: 1.5px solid #F2B8B5;
    }
    .zone-badge-new {
      background: rgba(255, 255, 255, 0.96);
      color: #137333;
      border: 1.5px solid #CBE6D3;
    }
    .zone-badge-road {
      background: rgba(255, 255, 255, 0.96);
      color: #0B57D0;
      border: 1.5px solid #D3E3FD;
      font-size: 8.5px;
    }

    /* Icon-First Landmark Pin — Label appears only when zoomed in (>=18) or selected */
    .campus-pin {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease;
      padding: 4px;
    }
    .campus-pin.is-leaflet {
      transform: translate(-50%, -50%);
    }
    .campus-pin-label {
      position: absolute;
      bottom: calc(100% + 2px);
      left: 50%;
      transform: translateX(-50%) translateY(4px) scale(0.92);
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.96);
      color: #111827;
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
      border: 1.5px solid var(--pin-color, #0B57D0);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.16);
      letter-spacing: 0.15px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s ease;
    }
    body.map-show-labels .campus-pin-label,
    .campus-pin.is-selected .campus-pin-label,
    .campus-pin.is-origin .campus-pin-label {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0) scale(1);
    }
    .campus-pin-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--pin-color, #0B57D0);
      color: #FFFFFF;
      border: 2px solid #FFFFFF;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.28);
      transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .campus-pin-icon svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .campus-pin.is-selected {
      z-index: 900 !important;
      transform: translate(-50%, -50%) scale(1.14);
    }
    .campus-pin.is-leaflet.is-selected {
      transform: translate(-50%, -50%) scale(1.14);
    }
    .campus-pin.is-selected .campus-pin-label {
      background: #0B57D0;
      color: #FFFFFF;
      border-color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(11, 87, 208, 0.38);
    }
    .campus-pin.is-selected .campus-pin-icon {
      width: 31px;
      height: 31px;
      background: #0B57D0;
      border-color: #FFFFFF;
      border-width: 2.5px;
      box-shadow: 0 0 0 4px rgba(11, 87, 208, 0.24), 0 4px 14px rgba(11, 87, 208, 0.42);
    }
    .leaflet-marker-icon.campus-leaflet-icon {
      background: transparent;
      border: none;
    }
  </style>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>
  <div id="google-map"></div>
  <div id="leaflet-map"></div>

  <script>
    // Verified BBSUTSD Khairpur Mirs center (27°30'39"N 68°44'30"E — Hami Road / near Civil Hospital)
    const BBSUTSD_CENTER = { lat: 27.5108, lng: 68.7416 };
    const CAMPUS_RADIUS_METERS = 360; // Full campus grounds footprint

    const RESTRICT_BOUNDS = {
      south: 27.5060,
      west: 68.7365,
      north: 27.5156,
      east: 68.7467
    };

    // Old Complex, New Complex, and Dividing Campus Road zones anchored on verified BBSUTSD coordinates
    const OLD_COMPLEX_ZONE = [
      { lat: 27.51162, lng: 68.74038 },
      { lat: 27.51162, lng: 68.74158 },
      { lat: 27.51090, lng: 68.74158 },
      { lat: 27.51090, lng: 68.74038 }
    ];
    const NEW_COMPLEX_ZONE = [
      { lat: 27.51074, lng: 68.74170 },
      { lat: 27.51074, lng: 68.74268 },
      { lat: 27.51016, lng: 68.74268 },
      { lat: 27.51016, lng: 68.74170 }
    ];
    const DIVIDING_ROAD_PATH = [
      { lat: 27.50965, lng: 68.74050 },
      { lat: 27.51035, lng: 68.74115 },
      { lat: 27.51082, lng: 68.74164 },
      { lat: 27.51145, lng: 68.74222 },
      { lat: 27.51185, lng: 68.74275 }
    ];

    const CATEGORY_COLORS = {
      ADMIN: '#B3261E',
      STUDENT_SERVICE: '#0B57D0',
      LAB: '#0F9D58',
      LIBRARY: '#7C3AED',
      AMENITY: '#0284C7',
      TRANSPORT_GATE: '#137333',
      ACADEMIC: '#334155'
    };

    let mapEngine = 'pending'; // 'google' | 'leaflet'
    let googleMap = null;
    let leafletMap = null;
    let leafletSatLayer = null;
    let leafletStreetLayer = null;
    let isSatelliteMode = false;
    const LABEL_ZOOM_THRESHOLD = 18;

    function syncZoomLabels(zoomLevel) {
      const z = Number(zoomLevel) || 17;
      if (document.body) {
        document.body.classList.toggle('map-show-labels', z >= LABEL_ZOOM_THRESHOLD);
      }
    }

    // Geometry & routing layers
    let verifiedOsmBoundary = null;
    let osmRoadSegments = [];
    let osmBuildingPolygons = []; // Array of { coords: [{lat,lng}], centerLat, centerLng }
    let geometryLayers = [];      // All polygons, polylines, badges cleared on re-render
    let routeLayers = [];         // Active multi-segment path, active segment & turn corner markers
    let activeRouteData = null;
    let activeStepIndex = 0;
    let lastOsrmFetch = null;

    // Landmark Pins state
    let allLandmarkPins = [];
    let activeCategoryFilter = 'ALL';
    let activeSearchQuery = '';
    let selectedPinId = null;
    let renderedMarkers = [];

    // User GPS / Custom Origin state
    let userLat = null;
    let userLng = null;
    let userAccuracy = 15;
    let customOrigin = null; // { lat, lng, label } | null
    let googleUserMarker = null;
    let googleUserAccuracyCircle = null;
    let leafletUserMarker = null;
    let leafletUserAccuracyCircle = null;

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function isPointInPolygon(lat, lng, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i].lat, yi = poly[i].lng;
        const xj = poly[j].lat, yj = poly[j].lng;
        const intersect = ((yi > lng) !== (yj > lng)) &&
                          (lat < (xj - xi) * (lng - yi) / ((yj - yi) || 1e-12) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function evaluateCampusContainment(lat, lng) {
      const centerDist = haversineMeters(lat, lng, BBSUTSD_CENTER.lat, BBSUTSD_CENTER.lng);
      if (verifiedOsmBoundary && verifiedOsmBoundary.length >= 3) {
        const inside = isPointInPolygon(lat, lng, verifiedOsmBoundary);
        let minEdgeDist = centerDist;
        verifiedOsmBoundary.forEach(pt => {
          const d = haversineMeters(lat, lng, pt.lat, pt.lng);
          if (d < minEdgeDist) minEdgeDist = d;
        });
        return {
          isInside: inside,
          distanceMeters: inside ? 0 : Math.round(minEdgeDist)
        };
      }
      const inside = centerDist <= CAMPUS_RADIUS_METERS;
      return {
        isInside: inside,
        distanceMeters: inside ? 0 : Math.round(centerDist - CAMPUS_RADIUS_METERS)
      };
    }

    function notifyBoundaryStatus() {
      if (userLat === null || userLng === null) return;
      const status = evaluateCampusContainment(userLat, userLng);
      if (window.AndroidBridge && window.AndroidBridge.onBoundaryStatusChanged) {
        window.AndroidBridge.onBoundaryStatusChanged(status.isInside, status.distanceMeters);
      }
    }

    function clearCampusGeometryOverlays() {
      geometryLayers.forEach(layer => {
        if (typeof layer.removeFn === 'function') {
          layer.removeFn();
        } else if (mapEngine === 'google') {
          layer.setMap(null);
        } else if (mapEngine === 'leaflet' && leafletMap) {
          leafletMap.removeLayer(layer);
        }
      });
      geometryLayers = [];
    }

    function addZoneBadge(lat, lng, text, cssClass) {
      if (mapEngine === 'google' && googleMap) {
        class ZoneBadgeOverlay extends google.maps.OverlayView {
          constructor() {
            super();
            this.div = null;
            this.pos = new google.maps.LatLng(lat, lng);
          }
          onAdd() {
            const el = document.createElement('div');
            el.className = 'zone-badge ' + cssClass;
            el.style.position = 'absolute';
            el.textContent = text;
            this.div = el;
            this.getPanes().overlayLayer.appendChild(el);
          }
          draw() {
            if (!this.div) return;
            const proj = this.getProjection();
            if (!proj) return;
            const pt = proj.fromLatLngToDivPixel(this.pos);
            if (pt) {
              this.div.style.left = pt.x + 'px';
              this.div.style.top = pt.y + 'px';
            }
          }
          onRemove() {
            if (this.div && this.div.parentNode) {
              this.div.parentNode.removeChild(this.div);
              this.div = null;
            }
          }
        }
        const overlay = new ZoneBadgeOverlay();
        overlay.setMap(googleMap);
        geometryLayers.push({ removeFn: () => overlay.setMap(null) });
      } else if (mapEngine === 'leaflet' && leafletMap) {
        const icon = L.divIcon({
          className: 'campus-leaflet-icon',
          html: `<div class="zone-badge is-leaflet ${cssClass}">${escapeHtml(text)}</div>`,
          iconSize: [0, 0],
          iconAnchor: [0, 0]
        });
        const m = L.marker([lat, lng], { icon: icon, interactive: false, zIndexOffset: 50 }).addTo(leafletMap);
        geometryLayers.push(m);
      }
    }

    function addPolygonLayer(coords, strokeColor, fillColor, fillOpacity, strokeWeight, dashArray) {
      if (mapEngine === 'google' && googleMap) {
        const poly = new google.maps.Polygon({
          paths: coords,
          strokeColor: strokeColor,
          strokeOpacity: 0.92,
          strokeWeight: strokeWeight,
          fillColor: fillColor,
          fillOpacity: fillOpacity,
          clickable: false,
          map: googleMap
        });
        geometryLayers.push(poly);
      } else if (mapEngine === 'leaflet' && leafletMap) {
        const poly = L.polygon(
          coords.map(p => [p.lat, p.lng]),
          {
            color: strokeColor,
            weight: strokeWeight,
            opacity: 0.92,
            fillColor: fillColor,
            fillOpacity: fillOpacity,
            dashArray: dashArray || null,
            interactive: false
          }
        ).addTo(leafletMap);
        geometryLayers.push(poly);
      }
    }

    function addPolylineLayer(coords, color, weight, opacity, dashArray) {
      if (mapEngine === 'google' && googleMap) {
        const line = new google.maps.Polyline({
          path: coords,
          strokeColor: color,
          strokeOpacity: opacity,
          strokeWeight: weight,
          clickable: false,
          map: googleMap
        });
        geometryLayers.push(line);
      } else if (mapEngine === 'leaflet' && leafletMap) {
        const line = L.polyline(
          coords.map(p => [p.lat, p.lng]),
          {
            color: color,
            weight: weight,
            opacity: opacity,
            dashArray: dashArray || null,
            interactive: false
          }
        ).addTo(leafletMap);
        geometryLayers.push(line);
      }
    }

    function renderCampusGeometry() {
      if (mapEngine === 'pending') return;
      clearCampusGeometryOverlays();

      // 1. Campus Outer Boundary
      if (verifiedOsmBoundary && verifiedOsmBoundary.length >= 3) {
        addPolygonLayer(verifiedOsmBoundary, '#0B57D0', '#0B57D0', 0.05, 2.5, '8, 6');
      } else {
        if (mapEngine === 'google' && googleMap) {
          geometryLayers.push(new google.maps.Circle({
            center: BBSUTSD_CENTER,
            radius: CAMPUS_RADIUS_METERS,
            strokeColor: '#0B57D0',
            strokeOpacity: 0.75,
            strokeWeight: 2.5,
            fillColor: '#0B57D0',
            fillOpacity: 0.05,
            clickable: false,
            map: googleMap
          }));
        } else if (mapEngine === 'leaflet' && leafletMap) {
          geometryLayers.push(L.circle([BBSUTSD_CENTER.lat, BBSUTSD_CENTER.lng], {
            radius: CAMPUS_RADIUS_METERS,
            color: '#0B57D0',
            weight: 2.5,
            opacity: 0.75,
            dashArray: '8, 6',
            fillColor: '#0B57D0',
            fillOpacity: 0.05,
            interactive: false
          }).addTo(leafletMap));
        }
      }

      // 2. Complex Zone Highlights (Old Complex = Crimson vs New Complex = Emerald)
      addPolygonLayer(OLD_COMPLEX_ZONE, '#B3261E', '#B3261E', 0.12, 2, '6, 5');
      addPolygonLayer(NEW_COMPLEX_ZONE, '#0F9D58', '#0F9D58', 0.12, 2, '6, 5');

      // 3. Up-to-date OSM Building Footprints inside Campus
      osmBuildingPolygons.forEach(bld => {
        const isOldComplexSide = (bld.centerLat >= 27.51085 || bld.centerLng < 68.74162);
        const color = isOldComplexSide ? '#B3261E' : '#0F9D58';
        addPolygonLayer(bld.coords, color, color, 0.22, 2, null);
      });

      // 4. Dividing Campus Road Highlight + Verified OSM Internal/Adjacent Roads
      addPolylineLayer(DIVIDING_ROAD_PATH, '#FFFFFF', 7, 0.9, null);
      addPolylineLayer(DIVIDING_ROAD_PATH, '#0B57D0', 3.5, 0.85, '10, 6');

      osmRoadSegments.forEach(segment => {
        addPolylineLayer(segment, '#64748B', 2.5, 0.55, null);
      });

      // 5. Clear Zone Badges for Old Complex, Dividing Road, and New Complex
      addZoneBadge(27.51162, 68.74098, 'Old Building Complex', 'zone-badge-old');
      addZoneBadge(27.51083, 68.74163, 'Campus Dividing Road', 'zone-badge-road');
      addZoneBadge(27.51018, 68.74220, 'New Building Complex', 'zone-badge-new');
    }

    function fetchVerifiedOsmCampusGeometry() {
      const query = `[out:json][timeout:12];
        (
          way["amenity"="university"](around:600,${BBSUTSD_CENTER.lat},${BBSUTSD_CENTER.lng});
          relation["amenity"="university"](around:600,${BBSUTSD_CENTER.lat},${BBSUTSD_CENTER.lng});
          way["landuse"="education"](around:600,${BBSUTSD_CENTER.lat},${BBSUTSD_CENTER.lng});
          way["building"](around:480,${BBSUTSD_CENTER.lat},${BBSUTSD_CENTER.lng});
          way["highway"](around:480,${BBSUTSD_CENTER.lat},${BBSUTSD_CENTER.lng});
        );
        out geom;`;

      const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);
      fetch(url)
        .then(res => res.ok ? res.json() : Promise.reject('OSM HTTP ' + res.status))
        .then(data => {
          if (!data || !Array.isArray(data.elements)) return;

          let bestPolygon = null;
          const roads = [];
          const buildings = [];

          data.elements.forEach(el => {
            if (el.type === 'way' && Array.isArray(el.geometry) && el.geometry.length >= 2) {
              const tags = el.tags || {};
              if (tags.amenity === 'university' || tags.landuse === 'education') {
                if (el.geometry.length >= 3) {
                  bestPolygon = el.geometry.map(g => ({ lat: g.lat, lng: g.lon }));
                }
              } else if (tags.building) {
                if (el.geometry.length >= 3) {
                  const coords = el.geometry.map(g => ({ lat: g.lat, lng: g.lon }));
                  const avgLat = coords.reduce((s, p) => s + p.lat, 0) / coords.length;
                  const avgLng = coords.reduce((s, p) => s + p.lng, 0) / coords.length;
                  if (haversineMeters(avgLat, avgLng, BBSUTSD_CENTER.lat, BBSUTSD_CENTER.lng) <= 380) {
                    buildings.push({ coords: coords, centerLat: avgLat, centerLng: avgLng });
                  }
                }
              } else if (tags.highway) {
                roads.push(el.geometry.map(g => ({ lat: g.lat, lng: g.lon })));
              }
            }
          });

          verifiedOsmBoundary = bestPolygon;
          osmRoadSegments = roads;
          osmBuildingPolygons = buildings;
          renderCampusGeometry();
          notifyBoundaryStatus();

          if (window.AndroidBridge && window.AndroidBridge.onOsmDataLoaded) {
            window.AndroidBridge.onOsmDataLoaded(bestPolygon !== null, roads.length, buildings.length);
          }
        })
        .catch(() => {
          if (window.AndroidBridge && window.AndroidBridge.onOsmDataLoaded) {
            window.AndroidBridge.onOsmDataLoaded(false, 0, 0);
          }
        });
    }

    // --- Labeled Landmark Markers ---
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function matchesActiveFilters(pin) {
      if (activeCategoryFilter && activeCategoryFilter !== 'ALL') {
        if (activeCategoryFilter === 'OFFICES') {
          if (pin.category !== 'ADMIN' && pin.category !== 'STUDENT_SERVICE') return false;
        } else if (activeCategoryFilter === 'LABS_WORKSHOPS') {
          if (pin.category !== 'LAB') return false;
        } else if (activeCategoryFilter === 'TRANSPORT') {
          if (pin.category !== 'TRANSPORT_GATE') return false;
        } else if (activeCategoryFilter === 'AMENITIES') {
          if (pin.category !== 'AMENITY' && pin.category !== 'LIBRARY') return false;
        } else if (pin.category !== activeCategoryFilter) {
          return false;
        }
      }
      if (activeSearchQuery) {
        const q = activeSearchQuery.toLowerCase();
        const hay = `${pin.label} ${pin.name} ${pin.subTitle || ''} ${pin.tags || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }

    function clearLandmarkMarkers() {
      renderedMarkers.forEach(m => m.removeFn());
      renderedMarkers = [];
    }

    const GRAPH_NODES = {
      gate_entry: { id: 'gate_entry', lat: 27.50965, lng: 68.74050 },
      gate_plaza: { id: 'gate_plaza', lat: 27.50998, lng: 68.74082 },
      mosque_jct: { id: 'mosque_jct', lat: 27.51035, lng: 68.74115 },
      quad_jct: { id: 'quad_jct', lat: 27.51062, lng: 68.74142 },
      dividing_center: { id: 'dividing_center', lat: 27.51082, lng: 68.74164 },
      new_mid_road: { id: 'new_mid_road', lat: 27.51112, lng: 68.74194 },
      ws_split: { id: 'ws_split', lat: 27.51145, lng: 68.74222 },
      hostel_jct: { id: 'hostel_jct', lat: 27.51172, lng: 68.74256 },
      transport_plaza: { id: 'transport_plaza', lat: 27.51185, lng: 68.74275 },
      mosque_walk: { id: 'mosque_walk', lat: 27.51055, lng: 68.74060 },
      old_porch: { id: 'old_porch', lat: 27.51092, lng: 68.74088 },
      old_west: { id: 'old_west', lat: 27.51125, lng: 68.74072 },
      old_center: { id: 'old_center', lat: 27.51118, lng: 68.74105 },
      old_east: { id: 'old_east', lat: 27.51120, lng: 68.74135 },
      old_north: { id: 'old_north', lat: 27.51144, lng: 68.74102 },
      canteen_quad: { id: 'canteen_quad', lat: 27.51022, lng: 68.74132 },
      new_porch: { id: 'new_porch', lat: 27.51056, lng: 68.74202 },
      new_west: { id: 'new_west', lat: 27.51036, lng: 68.74192 },

    function calculateBearingDeg(lat1, lon1, lat2, lon2) {
      const phi1 = lat1 * Math.PI / 180;
      const phi2 = lat2 * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(dLon) * Math.cos(phi2);
      const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLon);
      return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
    }

    function compassDirLabel(deg) {
      const dirs = ['North', 'North-East', 'East', 'South-East', 'South', 'South-West', 'West', 'North-West'];
      return dirs[Math.round(((deg % 360) / 45)) % 8];
    }

    function classifyTurnDelta(delta) {
      const d = ((delta + 540) % 360) - 180;
      if (Math.abs(d) < 22) return { action: 'STRAIGHT', verb: 'Continue straight' };
      if (d >= 22 && d < 55) return { action: 'KEEP_RIGHT', verb: 'Keep right' };
      if (d >= 55 && d < 120) return { action: 'RIGHT', verb: 'Turn right' };
      if (d >= 120) return { action: 'SHARP_RIGHT', verb: 'Make a sharp right' };
      if (d <= -22 && d > -55) return { action: 'KEEP_LEFT', verb: 'Keep left' };
      if (d <= -55 && d > -120) return { action: 'LEFT', verb: 'Turn left' };
      return { action: 'SHARP_LEFT', verb: 'Make a sharp left' };
    }

    function projectPointOntoSegment(p, a, b) {
      const cosLat = Math.cos(27.5108 * Math.PI / 180);
      const px = p.lng * 111320 * cosLat, py = p.lat * 110810;
      const ax = a.lng * 111320 * cosLat, ay = a.lat * 110810;
      const bx = b.lng * 111320 * cosLat, by = b.lat * 110810;
      const dx = bx - ax, dy = by - ay;
      const lenSq = dx * dx + dy * dy;
      let t = 0;
      if (lenSq > 1e-9) {
        t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lenSq));
      }
      const proj = { lat: a.lat + t * (b.lat - a.lat), lng: a.lng + t * (b.lng - a.lng) };
      return { point: proj, t, distMeters: haversineMeters(p.lat, p.lng, proj.lat, proj.lng) };
    }

    function attachPointToDynamicGraph(virtualId, coord, approachName, nodes, adj, preferredNodeId) {
      nodes[virtualId] = { id: virtualId, lat: coord.lat, lng: coord.lng, label: approachName };
      adj[virtualId] = [];

      const edgeCandidates = [];
      EDGE_DEFS.forEach(([u, v, streetName]) => {
        const nu = GRAPH_NODES[u], nv = GRAPH_NODES[v];
        if (!nu || !nv) return;
        const res = projectPointOntoSegment(coord, nu, nv);
        edgeCandidates.push({ u, v, streetName, proj: res.point, t: res.t, distMeters: res.distMeters });
      });

      edgeCandidates.sort((a, b) => a.distMeters - b.distMeters);
      const topEdges = edgeCandidates.filter((c, i) => i < 4 && (i === 0 || c.distMeters <= 75));

      topEdges.forEach((cand, idx) => {
        if (cand.t <= 0.04) {
          adj[virtualId].push({ to: cand.u, streetName: approachName });
          if (adj[cand.u]) adj[cand.u].push({ to: virtualId, streetName: approachName });
        } else if (cand.t >= 0.96) {
          adj[virtualId].push({ to: cand.v, streetName: approachName });
          if (adj[cand.v]) adj[cand.v].push({ to: virtualId, streetName: approachName });
        } else {
          const splitId = `${virtualId}_proj_${idx}`;
          nodes[splitId] = { id: splitId, lat: cand.proj.lat, lng: cand.proj.lng, label: cand.streetName };
          adj[splitId] = [
            { to: cand.u, streetName: cand.streetName },
            { to: cand.v, streetName: cand.streetName },
            { to: virtualId, streetName: approachName }
          ];
          if (adj[cand.u]) adj[cand.u].push({ to: splitId, streetName: cand.streetName });
          if (adj[cand.v]) adj[cand.v].push({ to: splitId, streetName: cand.streetName });
          adj[virtualId].push({ to: splitId, streetName: approachName });
        }
      });

      const nodeDists = Object.values(GRAPH_NODES)
        .map(n => ({ id: n.id, d: haversineMeters(coord.lat, coord.lng, n.lat, n.lng) }))
        .sort((a, b) => a.d - b.d);

      const nearbyIds = new Set();
      if (nodeDists[0]) nearbyIds.add(nodeDists[0].id);
      if (nodeDists[1] && nodeDists[1].d <= 65) nearbyIds.add(nodeDists[1].id);
      if (preferredNodeId && GRAPH_NODES[preferredNodeId]) nearbyIds.add(preferredNodeId);

      nearbyIds.forEach(targetId => {
        if (!adj[virtualId].some(e => e.to === targetId)) {
          adj[virtualId].push({ to: targetId, streetName: approachName });
          if (adj[targetId]) adj[targetId].push({ to: virtualId, streetName: approachName });
        }
      });
    }

    function solveShortestDynamicDijkstra(originLat, originLng, originLabel, pin) {
      const nodes = {};
      Object.keys(GRAPH_NODES).forEach(k => { nodes[k] = Object.assign({}, GRAPH_NODES[k]); });
      const adj = {};
      Object.keys(nodes).forEach(id => { adj[id] = []; });
      EDGE_DEFS.forEach(([a, b, streetName]) => {
        if (adj[a]) adj[a].push({ to: b, streetName });
        if (adj[b]) adj[b].push({ to: a, streetName });
      });

      const startId = '__start__';
      const endId = '__end__';
      attachPointToDynamicGraph(startId, { lat: originLat, lng: originLng }, 'Walkway from ' + (originLabel || 'Your Location'), nodes, adj);
      attachPointToDynamicGraph(endId, { lat: pin.lat, lng: pin.lng }, (pin.label || pin.name) + ' Entrance', nodes, adj, PIN_TO_NODE[pin.id]);

      Object.keys(nodes).forEach(sId => {
        if (!sId.startsWith('__start___proj_')) return;
        Object.keys(nodes).forEach(eId => {
          if (!eId.startsWith('__end___proj_')) return;
          const sN = (adj[sId] || []).map(x => x.to).filter(x => x !== startId);
          const eN = (adj[eId] || []).map(x => x.to).filter(x => x !== endId);
          if (sN.length === 2 && eN.length === 2 &&
              ((sN[0] === eN[0] && sN[1] === eN[1]) || (sN[0] === eN[1] && sN[1] === eN[0]))) {
            adj[sId].push({ to: eId, streetName: nodes[sId].label });
            adj[eId].push({ to: sId, streetName: nodes[eId].label });
          }
        });
      });

      const dist = {};
      const prev = {};
      const unvisited = new Set(Object.keys(nodes));
      unvisited.forEach(id => { dist[id] = Infinity; prev[id] = null; });
      dist[startId] = 0;

      while (unvisited.size > 0) {
        let curr = null;
        let smallest = Infinity;
        unvisited.forEach(id => {
          if (dist[id] < smallest) { smallest = dist[id]; curr = id; }
        });
        if (!curr || curr === endId || smallest === Infinity) break;
        unvisited.delete(curr);

        const cNode = nodes[curr];
        (adj[curr] || []).forEach(edge => {
          if (!unvisited.has(edge.to)) return;
          const tNode = nodes[edge.to];
          const w = haversineMeters(cNode.lat, cNode.lng, tNode.lat, tNode.lng);
          const alt = dist[curr] + w;
          if (alt < dist[edge.to]) {
            dist[edge.to] = alt;
            prev[edge.to] = { id: curr, streetName: edge.streetName };
          }
        });
      }

      const nodeIds = [];
      const edgeNames = [];
      let cur = endId;
      while (cur) {
        nodeIds.unshift(cur);
        const p = prev[cur];
        if (p) { edgeNames.unshift(p.streetName); cur = p.id; }
        else cur = null;
      }
      return {
        points: nodeIds.map(id => ({ lat: nodes[id].lat, lng: nodes[id].lng })),
        segNames: edgeNames
      };
    }

    function computeWalkableCampusRoute(originLat, originLng, originLabel, pin) {
      const destCoord = { lat: pin.lat, lng: pin.lng };
      const directDist = haversineMeters(originLat, originLng, destCoord.lat, destCoord.lng);

      let rawPoints = [];
      let rawNames = [];
      if (directDist <= 28) {
        rawPoints = [{ lat: originLat, lng: originLng }, destCoord];
        rawNames = ['Walk directly to ' + (pin.label || pin.name)];
      } else {
        const solved = solveShortestDynamicDijkstra(originLat, originLng, originLabel, pin);
        rawPoints = solved.points;
        rawNames = solved.segNames;
      }

      const cleanedPoints = [];
      const cleanedNames = [];
      for (let i = 0; i < rawPoints.length; i++) {
        const pt = rawPoints[i];
        if (cleanedPoints.length === 0) {
          cleanedPoints.push(pt);
        } else {
          const prevPt = cleanedPoints[cleanedPoints.length - 1];
          const d = haversineMeters(prevPt.lat, prevPt.lng, pt.lat, pt.lng);
          if (d >= 2.5 || i === rawPoints.length - 1) {
            cleanedPoints.push(pt);
            cleanedNames.push(rawNames[i - 1] || 'Campus Walkway');
          }
        }
      }

      if (cleanedPoints.length < 2) {
        cleanedPoints.push(destCoord);
        cleanedNames.push('Immediate Arrival');
      }

      const segs = [];
      let totalDist = 0;
      for (let i = 0; i < cleanedPoints.length - 1; i++) {
        const a = cleanedPoints[i], b = cleanedPoints[i + 1];
        const d = haversineMeters(a.lat, a.lng, b.lat, b.lng);
        if (d < 1.5 && cleanedPoints.length > 2) continue;
        totalDist += d;
        segs.push({
          from: a, to: b, dist: d,
          bearing: calculateBearingDeg(a.lat, a.lng, b.lat, b.lng),
          streetName: cleanedNames[i] || 'Campus Walkway'
        });
      }

      const steps = [];
      if (segs.length > 0) {
        let curCoords = [segs[0].from, segs[0].to];
        let curDist = segs[0].dist;
        let curStreet = segs[0].streetName;
        let curBearing = segs[0].bearing;
        let pendingAction = 'START';
        let pendingVerb = 'Head ' + compassDirLabel(curBearing);

        const flush = () => {
          const r = Math.max(1, Math.round(curDist));
          const text = pendingAction === 'START'
            ? `${pendingVerb} along ${curStreet} for ${r} m`
            : `${pendingVerb} onto ${curStreet} • ${r} m`;
          steps.push({
            action: pendingAction,
            instruction: text,
            streetName: curStreet,
            distanceMeters: r,
            coord: curCoords[0],
            segmentCoords: curCoords.slice()
          });
        };

        for (let i = 1; i < segs.length; i++) {
          const nxt = segs[i];
          const turn = classifyTurnDelta(nxt.bearing - curBearing);
          if (turn.action === 'STRAIGHT' && (nxt.streetName === curStreet || nxt.dist < 14)) {
            curCoords.push(nxt.to);
            curDist += nxt.dist;
            curBearing = nxt.bearing;
          } else {
            flush();
            pendingAction = turn.action;
            pendingVerb = turn.verb;
            curStreet = nxt.streetName;
            curCoords = [nxt.from, nxt.to];
            curDist = nxt.dist;
            curBearing = nxt.bearing;
          }
        }
        flush();
      }

      steps.push({
        action: 'ARRIVE',
        instruction: `Arrive at ${pin.name}`,
        streetName: 'Destination',
        distanceMeters: 0,
        coord: destCoord,
        segmentCoords: [destCoord]
      });

      const roundedTotal = Math.round(totalDist);
      return {
        polyline: cleanedPoints,
        steps: steps,
        totalDistanceMeters: roundedTotal,
        estimatedMinutes: Math.max(1, Math.round(roundedTotal / 75))
      };
    }

    function clearRouteLayers() {
      routeLayers.forEach(layer => {
        if (typeof layer.removeFn === 'function') layer.removeFn();
        else if (mapEngine === 'google') layer.setMap(null);
        else if (mapEngine === 'leaflet' && leafletMap) leafletMap.removeLayer(layer);
      });
      routeLayers = [];
    }

    function drawRenderedRoute(route) {
      clearRouteLayers();
      activeRouteData = route;
      if (activeStepIndex >= route.steps.length) {
        activeStepIndex = Math.max(0, route.steps.length - 1);
      }

      if (window.AndroidBridge && window.AndroidBridge.onRouteCalculated) {
        window.AndroidBridge.onRouteCalculated(JSON.stringify({
          totalDistanceMeters: route.totalDistanceMeters,
          estimatedMinutes: route.estimatedMinutes,
          steps: route.steps.map(s => ({
            action: s.action,
            instruction: s.instruction,
            streetName: s.streetName,
            distanceMeters: s.distanceMeters
          }))
        }));
      }

      if (mapEngine === 'google' && googleMap) {
        routeLayers.push(new google.maps.Polyline({
          path: route.polyline,
          strokeColor: '#FFFFFF',
          strokeOpacity: 0.95,
          strokeWeight: 8,
          clickable: false,
          map: googleMap
        }));
        routeLayers.push(new google.maps.Polyline({
          path: route.polyline,
          strokeColor: '#0B57D0',
          strokeOpacity: 0.96,
          strokeWeight: 5,
          clickable: false,
          map: googleMap
        }));
        const curStep = route.steps[activeStepIndex];
        if (curStep && curStep.segmentCoords && curStep.segmentCoords.length >= 2) {
          routeLayers.push(new google.maps.Polyline({
            path: curStep.segmentCoords,
            strokeColor: '#0F9D58',
            strokeOpacity: 0.98,
            strokeWeight: 6.5,
            clickable: false,
            map: googleMap
          }));
        }
      } else if (mapEngine === 'leaflet' && leafletMap) {
        const latLngs = route.polyline.map(p => [p.lat, p.lng]);
        routeLayers.push(L.polyline(latLngs, {
          color: '#FFFFFF',
          weight: 8,
          opacity: 0.95,
          interactive: false
        }).addTo(leafletMap));
        routeLayers.push(L.polyline(latLngs, {
          color: '#0B57D0',
          weight: 5,
          opacity: 0.96,
          interactive: false
        }).addTo(leafletMap));

        const curStep = route.steps[activeStepIndex];
        if (curStep && curStep.segmentCoords && curStep.segmentCoords.length >= 2) {
          routeLayers.push(L.polyline(curStep.segmentCoords.map(p => [p.lat, p.lng]), {
            color: '#0F9D58',
            weight: 6.5,
            opacity: 0.98,
            interactive: false
          }).addTo(leafletMap));
        }

        route.steps.forEach((step, idx) => {
          if (step.action === 'ARRIVE') return;
          const active = idx === activeStepIndex;
          const badge = L.divIcon({
            className: 'campus-leaflet-icon',
            html: `<div style="min-width:22px;height:22px;padding:0 5px;border-radius:9999px;background:${active ? '#0B57D0' : '#FFFFFF'};color:${active ? '#FFFFFF' : '#0B57D0'};border:2px solid ${active ? '#FFFFFF' : '#0B57D0'};font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(15,23,42,0.22);">${idx + 1}</div>`,
            iconSize: [0, 0],
            iconAnchor: [0, 0]
          });
          routeLayers.push(L.marker([step.coord.lat, step.coord.lng], {
            icon: badge,
            interactive: false,
            zIndexOffset: active ? 970 : 740
          }).addTo(leafletMap));
        });
      }
    }

    function updateGuideLine() {
      const origLat = customOrigin ? customOrigin.lat : userLat;
      const origLng = customOrigin ? customOrigin.lng : userLng;
      const origLabel = customOrigin ? customOrigin.label : 'Your Live GPS';

      if (!selectedPinId || origLat === null || origLng === null) {
        clearRouteLayers();
        activeRouteData = null;
        if (window.AndroidBridge && window.AndroidBridge.onRouteCalculated) {
          window.AndroidBridge.onRouteCalculated('');
        }
        return;
      }
      const pin = allLandmarkPins.find(p => p.id === selectedPinId);
      if (!pin) return;

      const localRoute = computeWalkableCampusRoute(origLat, origLng, origLabel, pin);
      drawRenderedRoute(localRoute);

      // If user's live GPS is outside campus boundaries (450m - 50km), enrich approach via live OSRM road network
      const distFromCampus = haversineMeters(origLat, origLng, BBSUTSD_CENTER.lat, BBSUTSD_CENTER.lng);
      if (!customOrigin && distFromCampus > 450 && distFromCampus <= 50000) {
        if (lastOsrmFetch && lastOsrmFetch.pinId === pin.id &&
            haversineMeters(lastOsrmFetch.lat, lastOsrmFetch.lng, origLat, origLng) < 18 &&
            lastOsrmFetch.route) {
          drawRenderedRoute(lastOsrmFetch.route);
          return;
        }
        const gatePin = allLandmarkPins.find(p => p.id === 'gate_main') || { lat: 27.50965, lng: 68.74050 };
        const osrmUrl = `https://router.project-osrm.org/route/v1/foot/${origLng},${origLat};${gatePin.lng},${gatePin.lat}?overview=full&geometries=geojson&steps=true`;
        const reqOrigin = { lat: origLat, lng: origLng, pinId: pin.id };
        fetch(osrmUrl)
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (!data || !data.routes || !data.routes[0]) return;
            if (selectedPinId !== reqOrigin.pinId) return;
            const osrm = data.routes[0];
            const roadPolyline = (osrm.geometry?.coordinates || []).map(c => ({ lat: c[1], lng: c[0] }));
            const roadSteps = [];
            const legs = osrm.legs && osrm.legs[0];
            if (legs && Array.isArray(legs.steps)) {
              legs.steps.forEach((s, idx) => {
                if (s.maneuver?.type === 'arrive') return;
                const mod = s.maneuver?.modifier || '';
                let action = idx === 0 ? 'START' : 'STRAIGHT';
                let verb = idx === 0 ? 'Start toward BBSUTSD Main Gate' : 'Continue straight';
                if (idx !== 0) {
                  if (mod.includes('sharp right')) { action = 'SHARP_RIGHT'; verb = 'Make a sharp right'; }
                  else if (mod.includes('slight right')) { action = 'KEEP_RIGHT'; verb = 'Keep right'; }
                  else if (mod.includes('right')) { action = 'RIGHT'; verb = 'Turn right'; }
                  else if (mod.includes('sharp left')) { action = 'SHARP_LEFT'; verb = 'Make a sharp left'; }
                  else if (mod.includes('slight left')) { action = 'KEEP_LEFT'; verb = 'Keep left'; }
                  else if (mod.includes('left')) { action = 'LEFT'; verb = 'Turn left'; }
                }
                const loc = s.maneuver?.location;
                const pt = loc ? { lat: loc[1], lng: loc[0] } : { lat: reqOrigin.lat, lng: reqOrigin.lng };
                const rName = (s.name && s.name.trim()) ? s.name : 'City Approach Road';
                const rDist = Math.round(s.distance || 0);
                roadSteps.push({
                  action,
                  instruction: `${verb} onto ${rName} • ${rDist} m`,
                  streetName: rName,
                  distanceMeters: rDist,
                  coord: pt,
                  segmentCoords: [pt]
                });
              });
            }
            const campusPart = computeWalkableCampusRoute(gatePin.lat, gatePin.lng, 'Main Entrance Gate', pin);
            const mergedDist = Math.round((osrm.distance || 0) + campusPart.totalDistanceMeters);
            const combined = {
              polyline: roadPolyline.concat(campusPart.polyline),
              steps: roadSteps.concat(campusPart.steps),
              totalDistanceMeters: mergedDist,
              estimatedMinutes: Math.max(1, Math.round(mergedDist / 75))
            };
            lastOsrmFetch = { pinId: reqOrigin.pinId, lat: reqOrigin.lat, lng: reqOrigin.lng, route: combined };
            drawRenderedRoute(combined);
          })
          .catch(() => {});
      }
    }

    function getCategoryPinSvg(pin) {
      const id = pin.id || '';
      if (id === 'campus_mosque') return '<svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
      if (id === 'campus_cafeteria') return '<svg viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/></svg>';
      if (id === 'campus_sports') return '<svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>';
      if (id.startsWith('hostel_')) return '<svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>';
      if (id === 'gate_main') return '<svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V9a7 7 0 0 1 14 0v12"/><path d="M9 21v-6a3 3 0 0 1 6 0v6"/></svg>';
      if (id === 'new_g_medical') return '<svg viewBox="0 0 24 24"><path d="M12 6v12"/><path d="M6 12h12"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg>';
      if (id.startsWith('ws_') || id === 'campus_workshops') return '<svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>';
      switch (pin.category) {
        case 'ADMIN': return '<svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V8l7-4 7 4v13"/><path d="M9 21v-5h6v5"/><path d="M9 11h.01"/><path d="M15 11h.01"/></svg>';
        case 'STUDENT_SERVICE': return '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>';
        case 'LAB': return '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M9 2v2"/><path d="M15 20v2"/><path d="M9 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/></svg>';
        case 'LIBRARY': return '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
        case 'TRANSPORT_GATE': return '<svg viewBox="0 0 24 24"><path d="M8 6v6"/><path d="M16 6v6"/><path d="M2 12h19.6"/><path d="M4 18V7a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v11"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>';
        case 'AMENITY': return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>';
        default: return '<svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>';
      }
    }

    function handlePinTap(pin) {
      selectedPinId = pin.id;
      activeStepIndex = 0;
      renderedMarkers.forEach(m => m.setSelectedFn(m.id === selectedPinId));
      updateGuideLine();
      if (window.AndroidBridge && window.AndroidBridge.onPinSelected) {
        window.AndroidBridge.onPinSelected(pin.id);
      }
    }

    function createGooglePinOverlay(pin, color) {
      class CampusPinOverlay extends google.maps.OverlayView {
        constructor() {
          super();
          this.div = null;
          this.pos = new google.maps.LatLng(pin.lat, pin.lng);
        }
        onAdd() {
          const el = document.createElement('div');
          el.className = 'campus-pin' + (pin.id === selectedPinId ? ' is-selected' : '');
          el.style.setProperty('--pin-color', color);
          el.style.position = 'absolute';
          el.innerHTML = `<div class="campus-pin-label">${escapeHtml(pin.label)}</div><div class="campus-pin-icon">${getCategoryPinSvg(pin)}</div>`;
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            handlePinTap(pin);
          });
          this.div = el;
          this.getPanes().overlayMouseTarget.appendChild(el);
        }
        draw() {
          if (!this.div) return;
          const proj = this.getProjection();
          if (!proj) return;
          const pt = proj.fromLatLngToDivPixel(this.pos);
          if (pt) {
            this.div.style.left = pt.x + 'px';
            this.div.style.top = pt.y + 'px';
          }
        }
        onRemove() {
          if (this.div && this.div.parentNode) {
            this.div.parentNode.removeChild(this.div);
            this.div = null;
          }
        }
        setSelected(selected) {
          if (this.div) {
            this.div.classList.toggle('is-selected', selected);
          }
        }
      }

      const overlay = new CampusPinOverlay();
      overlay.setMap(googleMap);
      return {
        id: pin.id,
        removeFn: () => overlay.setMap(null),
        setSelectedFn: (sel) => overlay.setSelected(sel)
      };
    }

    function createLeafletPinMarker(pin, color) {
      const html = `<div class="campus-pin is-leaflet${pin.id === selectedPinId ? ' is-selected' : ''}" style="--pin-color:${color}">
        <div class="campus-pin-label">${escapeHtml(pin.label)}</div>
        <div class="campus-pin-icon">${getCategoryPinSvg(pin)}</div>
      </div>`;

      const icon = L.divIcon({
        className: 'campus-leaflet-icon',
        html: html,
        iconSize: [0, 0],
        iconAnchor: [0, 0]
      });

      const marker = L.marker([pin.lat, pin.lng], {
        icon: icon,
        zIndexOffset: pin.id === selectedPinId ? 850 : 200
      }).addTo(leafletMap);

      marker.on('click', () => handlePinTap(pin));

      return {
        id: pin.id,
        removeFn: () => { if (leafletMap) leafletMap.removeLayer(marker); },
        setSelectedFn: (sel) => {
          const el = marker.getElement();
          if (el) {
            const inner = el.querySelector('.campus-pin');
            if (inner) inner.classList.toggle('is-selected', sel);
          }
          marker.setZIndexOffset(sel ? 850 : 200);
        }
      };
    }

    function renderLandmarkMarkers() {
      if (mapEngine === 'pending') return;
      clearLandmarkMarkers();

      const visiblePins = allLandmarkPins.filter(matchesActiveFilters);
      visiblePins.forEach(pin => {
        const color = CATEGORY_COLORS[pin.category] || '#0B57D0';
        if (mapEngine === 'google' && googleMap) {
          renderedMarkers.push(createGooglePinOverlay(pin, color));
        } else if (mapEngine === 'leaflet' && leafletMap) {
          renderedMarkers.push(createLeafletPinMarker(pin, color));
        }
      });
    }

    // --- Map Engine Init ---
    function initGoogleMaps() {
      try {
        mapEngine = 'google';
        const cleanStyles = [
          { featureType: 'poi', stylers: [{ visibility: 'off' }] },
          { featureType: 'transit', stylers: [{ visibility: 'off' }] }
        ];

        googleMap = new google.maps.Map(document.getElementById('google-map'), {
          center: BBSUTSD_CENTER,
          zoom: 17,
          minZoom: 16,
          maxZoom: 20,
          mapTypeId: isSatelliteMode ? google.maps.MapTypeId.SATELLITE : google.maps.MapTypeId.ROADMAP,
          styles: cleanStyles,
          disableDefaultUI: true,
          gestureHandling: 'greedy',
          restriction: {
            latLngBounds: RESTRICT_BOUNDS,
            strictBounds: false
          }
        });

        googleMap.addListener('click', () => {
          if (selectedPinId) {
            window.clearSelectedPin();
            if (window.AndroidBridge && window.AndroidBridge.onPinSelected) {
              window.AndroidBridge.onPinSelected('');
            }
          }
        });

        googleMap.addListener('zoom_changed', () => syncZoomLabels(googleMap.getZoom()));
        syncZoomLabels(googleMap.getZoom());

        renderCampusGeometry();
        renderLandmarkMarkers();
        if (userLat !== null && userLng !== null) {
          drawOrUpdateUserMarker();
        }
        if (window.AndroidBridge && window.AndroidBridge.onMapEngineReady) {
          window.AndroidBridge.onMapEngineReady('google');
        }
      } catch (e) {
        initLeafletMap();
      }
    }

    function initLeafletMap() {
      if (mapEngine === 'leaflet') return;
      mapEngine = 'leaflet';
      document.getElementById('google-map').style.display = 'none';
      document.getElementById('leaflet-map').style.display = 'block';

      const bounds = L.latLngBounds(
        [RESTRICT_BOUNDS.south, RESTRICT_BOUNDS.west],
        [RESTRICT_BOUNDS.north, RESTRICT_BOUNDS.east]
      );

      leafletMap = L.map('leaflet-map', {
        center: [BBSUTSD_CENTER.lat, BBSUTSD_CENTER.lng],
        zoom: 17,
        minZoom: 16,
        maxZoom: 19,
        maxBounds: bounds,
        maxBoundsViscosity: 0.9,
        zoomControl: false,
        attributionControl: false
      });

      leafletSatLayer = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 19 }
      );
      leafletStreetLayer = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        { maxZoom: 19 }
      );

      if (isSatelliteMode) {
        leafletSatLayer.addTo(leafletMap);
      } else {
        leafletStreetLayer.addTo(leafletMap);
      }

      leafletMap.on('click', () => {
        if (selectedPinId) {
          window.clearSelectedPin();
          if (window.AndroidBridge && window.AndroidBridge.onPinSelected) {
            window.AndroidBridge.onPinSelected('');
          }
        }
      });

      leafletMap.on('zoomend', () => syncZoomLabels(leafletMap.getZoom()));
      syncZoomLabels(leafletMap.getZoom());

      renderCampusGeometry();
      renderLandmarkMarkers();
      if (userLat !== null && userLng !== null) {
        drawOrUpdateUserMarker();
      }
      if (window.AndroidBridge && window.AndroidBridge.onMapEngineReady) {
        window.AndroidBridge.onMapEngineReady('leaflet');
      }
    }

    function drawOrUpdateUserMarker() {
      if (userLat === null || userLng === null) return;
      const clampedAcc = Math.min(Math.max(userAccuracy || 15, 5), 120);

      if (mapEngine === 'google' && googleMap) {
        const pos = { lat: userLat, lng: userLng };
        if (!googleUserAccuracyCircle) {
          googleUserAccuracyCircle = new google.maps.Circle({
            center: pos,
            radius: clampedAcc,
            strokeColor: '#0B57D0',
            strokeOpacity: 0.45,
            strokeWeight: 1,
            fillColor: '#0B57D0',
            fillOpacity: 0.14,
            clickable: false,
            map: googleMap
          });
        } else {
          googleUserAccuracyCircle.setCenter(pos);
          googleUserAccuracyCircle.setRadius(clampedAcc);
        }

        if (!googleUserMarker) {
          googleUserMarker = new google.maps.Marker({
            position: pos,
            map: googleMap,
            title: 'Your Live GPS Location',
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: 8.5,
              fillColor: '#0B57D0',
              fillOpacity: 1,
              strokeColor: '#FFFFFF',
              strokeWeight: 3
            },
            zIndex: 999
          });
        } else {
          googleUserMarker.setPosition(pos);
        }
      } else if (mapEngine === 'leaflet' && leafletMap) {
        const latLng = [userLat, userLng];
        if (!leafletUserAccuracyCircle) {
          leafletUserAccuracyCircle = L.circle(latLng, {
            radius: clampedAcc,
            color: '#0B57D0',
            weight: 1,
            opacity: 0.45,
            fillColor: '#0B57D0',
            fillOpacity: 0.14,
            interactive: false
          }).addTo(leafletMap);
        } else {
          leafletUserAccuracyCircle.setLatLng(latLng);
          leafletUserAccuracyCircle.setRadius(clampedAcc);
        }

        if (!leafletUserMarker) {
          const gpsIcon = L.divIcon({
            className: '',
            html: '<div class="gps-dot-wrapper"><div class="gps-dot-pulse"></div><div class="gps-dot-core"></div></div>',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });
          leafletUserMarker = L.marker(latLng, { icon: gpsIcon, interactive: false, zIndexOffset: 999 }).addTo(leafletMap);
        } else {
          leafletUserMarker.setLatLng(latLng);
        }
      }
      updateGuideLine();
    }

    // --- Public JS Bridge API ---
    window.setLandmarkPins = function(pins) {
      if (typeof pins === 'string') {
        try { pins = JSON.parse(pins); } catch (_) { pins = []; }
      }
      allLandmarkPins = Array.isArray(pins) ? pins : [];
      renderLandmarkMarkers();
    };

    window.filterLandmarkPins = function(categoryFilter, searchQuery) {
      activeCategoryFilter = categoryFilter || 'ALL';
      activeSearchQuery = (searchQuery || '').trim();
      renderLandmarkMarkers();
    };

    window.focusLandmarkPin = function(pinId) {
      selectedPinId = pinId;
      activeStepIndex = 0;
      const pin = allLandmarkPins.find(p => p.id === pinId);
      if (pin) {
        if (mapEngine === 'google' && googleMap) {
          googleMap.panTo({ lat: pin.lat, lng: pin.lng });
          googleMap.setZoom(18);
        } else if (mapEngine === 'leaflet' && leafletMap) {
          leafletMap.setView([pin.lat, pin.lng], 18, { animate: true });
        }
      }
      renderedMarkers.forEach(m => m.setSelectedFn(m.id === selectedPinId));
      updateGuideLine();
    };

    window.setCustomRouteOrigin = function(lat, lng, label) {
      if (lat === null || lng === null || isNaN(lat) || isNaN(lng)) {
        customOrigin = null;
      } else {
        customOrigin = { lat: Number(lat), lng: Number(lng), label: label || 'Selected Start' };
      }
      activeStepIndex = 0;
      updateGuideLine();
    };

    window.highlightRouteStep = function(idx) {
      activeStepIndex = Number(idx) || 0;
      updateGuideLine();
      if (activeRouteData && activeRouteData.steps[activeStepIndex]) {
        const s = activeRouteData.steps[activeStepIndex];
        if (mapEngine === 'google' && googleMap) {
          googleMap.panTo(s.coord);
          googleMap.setZoom(19);
        } else if (mapEngine === 'leaflet' && leafletMap) {
          leafletMap.setView([s.coord.lat, s.coord.lng], 19, { animate: true });
        }
      }
    };

    window.clearSelectedPin = function() {
      selectedPinId = null;
      activeStepIndex = 0;
      renderedMarkers.forEach(m => m.setSelectedFn(false));
      updateGuideLine();
    };

    window.updateUserLocation = function(lat, lng, accuracy) {
      userLat = lat;
      userLng = lng;
      userAccuracy = accuracy || 15;
      drawOrUpdateUserMarker();
      notifyBoundaryStatus();
    };

    window.recenterOnUser = function() {
      if (userLat === null || userLng === null) return;
      const status = evaluateCampusContainment(userLat, userLng);

      if (status.isInside) {
        if (mapEngine === 'google' && googleMap) {
          googleMap.panTo({ lat: userLat, lng: userLng });
          googleMap.setZoom(18);
        } else if (mapEngine === 'leaflet' && leafletMap) {
          leafletMap.setView([userLat, userLng], 18, { animate: true });
        }
      } else {
        window.recenterCampus();
        if (window.AndroidBridge && window.AndroidBridge.onOutsideCampusAlert) {
          window.AndroidBridge.onOutsideCampusAlert(status.distanceMeters);
        }
      }
    };

    window.recenterCampus = function() {
      if (mapEngine === 'google' && googleMap) {
        googleMap.panTo(BBSUTSD_CENTER);
        googleMap.setZoom(17);
      } else if (mapEngine === 'leaflet' && leafletMap) {
        leafletMap.setView([BBSUTSD_CENTER.lat, BBSUTSD_CENTER.lng], 17, { animate: true });
      }
    };

    window.setMapTypeMode = function(mode) {
      isSatelliteMode = (mode === 'satellite');
      if (mapEngine === 'google' && googleMap) {
        googleMap.setMapTypeId(isSatelliteMode ? google.maps.MapTypeId.SATELLITE : google.maps.MapTypeId.ROADMAP);
      } else if (mapEngine === 'leaflet' && leafletMap) {
        if (isSatelliteMode) {
          if (leafletMap.hasLayer(leafletStreetLayer)) leafletMap.removeLayer(leafletStreetLayer);
          leafletSatLayer.addTo(leafletMap);
        } else {
          if (leafletMap.hasLayer(leafletSatLayer)) leafletMap.removeLayer(leafletSatLayer);
          leafletStreetLayer.addTo(leafletMap);
        }
      }
    };

    window.zoomInMap = function() {
      if (mapEngine === 'google' && googleMap) {
        googleMap.setZoom(Math.min(20, (googleMap.getZoom() || 17) + 1));
      } else if (mapEngine === 'leaflet' && leafletMap) {
        leafletMap.zoomIn();
      }
    };

    window.zoomOutMap = function() {
      if (mapEngine === 'google' && googleMap) {
        googleMap.setZoom(Math.max(16, (googleMap.getZoom() || 17) - 1));
      } else if (mapEngine === 'leaflet' && leafletMap) {
        leafletMap.zoomOut();
      }
    };

    (function bootstrap() {
      fetchVerifiedOsmCampusGeometry();

      const params = new URLSearchParams(window.location.search);
      const apiKey = params.get('apiKey') || '';

      if (apiKey) {
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&callback=initGoogleMaps`;
        script.async = true;
        script.defer = true;
        script.onerror = function() { initLeafletMap(); };
        document.head.appendChild(script);

        setTimeout(() => {
          if (mapEngine === 'pending') initLeafletMap();
        }, 3500);
      } else {
        initLeafletMap();
      }
    })();
  </script>
