<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>BBSUTSD Campus Map &amp; Complexes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FAF7F2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #google-map, #leaflet-map {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }
    #leaflet-map {
      display: none;
    }

    /* Pulsing live Pixel Cobalt GPS dot */
    .gps-dot-wrapper {
      position: relative;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .gps-dot-pulse {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(11, 87, 208, 0.28);
      animation: gpsPulse 1.8s ease-out infinite;
    }
    .gps-dot-core {
      position: relative;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0B57D0;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(11, 87, 208, 0.45);
    }
    @keyframes gpsPulse {
      0% { transform: scale(0.8); opacity: 0.95; }
      70% { transform: scale(2.2); opacity: 0; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* Complex & Dividing Road Badges — Minimalist Warm Nutty Pills */
    .zone-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 9999px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.35px;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 3px 10px rgba(72, 43, 21, 0.16);
    }
    .zone-badge.is-leaflet {
      transform: none;
      margin-left: -50%;
      margin-top: -50%;
    }
    .zone-badge-old {
      background: rgba(255, 253, 249, 0.97);
      color: #B3261E;
      border: 1.5px solid #F2B8B5;
    }
    .zone-badge-new {
      background: rgba(255, 253, 249, 0.97);
      color: #137333;
      border: 1.5px solid #CBE6D3;
    }
    .zone-badge-road {
      background: rgba(255, 253, 249, 0.97);
      color: #7C4D2B;
      border: 1.5px solid #DFCBB4;
      font-size: 8.5px;
    }

    /* Icon-First Landmark Pin — Label appears when zoomed in (>=18), hovered, spiderfied, or selected */
    .campus-pin {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      padding: 4px;
    }
    .campus-pin.is-leaflet {
      transform: translate(-50%, -50%);
    }
    .campus-pin:hover {
      z-index: 880 !important;
      transform: translate(-50%, -54%) scale(1.12);
    }
    .campus-pin:active {
      transform: translate(-50%, -50%) scale(0.96);
    }
    .campus-pin-label {
      position: absolute;
      bottom: calc(100% + 3px);
      left: 50%;
      transform: translateX(-50%) translateY(4px) scale(0.92);
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(255, 253, 249, 0.98);
      color: #1F1812;
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
      border: 1.5px solid var(--pin-color, #7C4D2B);
      box-shadow: 0 3px 10px rgba(72, 43, 21, 0.18);
      letter-spacing: 0.15px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    }
    body.map-show-labels .campus-pin-label,
    .campus-pin:hover .campus-pin-label,
    .campus-pin.is-selected .campus-pin-label,
    .campus-pin.is-spider-child .campus-pin-label,
    .campus-pin.is-origin .campus-pin-label {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0) scale(1);
    }
    .campus-pin-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--pin-color, #0B57D0);
      color: #FFFFFF;
      border: 2px solid #FFFDF9;
      box-shadow: 0 3px 9px rgba(72, 43, 21, 0.28), 0 1px 3px rgba(31, 24, 18, 0.16);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.18s ease, box-shadow 0.2s ease;
    }
    .campus-pin:hover .campus-pin-icon {
      box-shadow: 0 0 0 4px rgba(166, 107, 63, 0.22), 0 6px 14px rgba(72, 43, 21, 0.34);
    }
    .campus-pin-icon svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .campus-pin.is-selected {
      z-index: 900 !important;
      transform: translate(-50%, -50%) scale(1.14);
    }
    .campus-pin.is-leaflet.is-selected {
      transform: translate(-50%, -50%) scale(1.14);
    }
    .campus-pin.is-selected .campus-pin-label {
      background: #0B57D0;
      color: #FFFFFF;
      border-color: #FFFFFF;
      box-shadow: 0 5px 14px rgba(11, 87, 208, 0.38);
    }
    .campus-pin.is-selected .campus-pin-icon {
      width: 32px;
      height: 32px;
      background: #0B57D0;
      border-color: #FFFFFF;
      border-width: 2.5px;
      box-shadow: 0 0 0 4px rgba(11, 87, 208, 0.24), 0 5px 14px rgba(11, 87, 208, 0.42);
    }

    /* Spiderfy Overlapping Cluster Hub & Dispersion Child Animations */
    .campus-spider-hub {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      padding: 4px;
    }
    .campus-spider-hub:hover {
      z-index: 920 !important;
      transform: translate(-50%, -55%) scale(1.1);
    }
    .campus-spider-hub-circle {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7C4D2B 0%, #A66B3F 100%);
      color: #FFFFFF;
      border: 2.5px solid #FFFDF9;
      box-shadow: 0 5px 14px rgba(72, 43, 21, 0.34), 0 0 0 3px rgba(246, 236, 224, 0.85);
      transition: box-shadow 0.2s ease;
    }
    .campus-spider-hub:hover .campus-spider-hub-circle {
      box-shadow: 0 8px 18px rgba(72, 43, 21, 0.42), 0 0 0 5px rgba(217, 179, 140, 0.55);
    }
    .campus-spider-count {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 9999px;
      background: #0B57D0;
      color: #FFFFFF;
      font-size: 9.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #FFFDF9;
      box-shadow: 0 2px 6px rgba(11, 87, 208, 0.35);
    }
    .campus-spider-hub .campus-pin-label {
      border-color: #7C4D2B;
      background: #FFFDF9;
      color: #7C4D2B;
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0) scale(1);
    }
    .campus-spider-anchor {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #7C4D2B;
      color: #FFFFFF;
      border: 2px solid #FFFDF9;
      box-shadow: 0 3px 10px rgba(72, 43, 21, 0.36);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }
    .campus-spider-anchor:hover {
      background: #5C371C;
      transform: translate(-50%, -50%) scale(1.16);
      box-shadow: 0 5px 14px rgba(72, 43, 21, 0.45);
    }
    .campus-pin.is-spider-child {
      z-index: 890 !important;
      animation: spiderPop 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes spiderPop {
      0% { transform: translate(-50%, -50%) scale(0.45); opacity: 0.2; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .leaflet-marker-icon.campus-leaflet-icon {
      background: transparent;
      border: none;
    }
  </style>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>
  <div id="google-map"></div>
  <div id="leaflet-map"></div>

  <script>
    // Verified BBSUTSD Khairpur Mirs center (27°30'39"N 68°44'30"E — Hami Road / near Civil Hospital)
    const BBSUTSD_CENTER = { lat: 27.5108, lng: 68.7416 };
    const CAMPUS_RADIUS_METERS = 360; // Full campus grounds footprint

    const RESTRICT_BOUNDS = {
      south: 27.5060,
      west: 68.7365,
      north: 27.5156,
      east: 68.7467
    };

    // Old Complex, New Complex, and Dividing Campus Road zones anchored on verified BBSUTSD coordinates
    const OLD_COMPLEX_ZONE = [
      { lat: 27.51162, lng: 68.74038 },
      { lat: 27.51162, lng: 68.74158 },
      { lat: 27.51090, lng: 68.74158 },
      { lat: 27.51090, lng: 68.74038 }
    ];
    const NEW_COMPLEX_ZONE = [
      { lat: 27.51074, lng: 68.74170 },
      { lat: 27.51074, lng: 68.74268 },
      { lat: 27.51016, lng: 68.74268 },
      { lat: 27.51016, lng: 68.74170 }
    ];
    const DIVIDING_ROAD_PATH = [
      { lat: 27.50965, lng: 68.74050 },
      { lat: 27.51035, lng: 68.74115 },
      { lat: 27.51082, lng: 68.74164 },
      { lat: 27.51145, lng: 68.74222 },
      { lat: 27.51185, lng: 68.74275 }
    ];

    const CATEGORY_COLORS = {
      ADMIN: '#B3261E',
      STUDENT_SERVICE: '#0B57D0',
      LAB: '#0F9D58',
      LIBRARY: '#7C3AED',
      AMENITY: '#0284C7',
      TRANSPORT_GATE: '#137333',
      ACADEMIC: '#334155'
    };

    let mapEngine = 'pending'; // 'google' | 'leaflet'
    let googleMap = null;
    let leafletMap = null;
    let leafletSatLayer = null;
    let leafletStreetLayer = null;
    let isSatelliteMode = true;
    const LABEL_ZOOM_THRESHOLD = 18;

    function syncZoomLabels(zoomLevel) {
      const z = Number(zoomLevel) || 17;
      if (document.body) {
        document.body.classList.toggle('map-show-labels', z >= LABEL_ZOOM_THRESHOLD);
      }
    }

    // Geometry & routing layers
    let verifiedOsmBoundary = null;
    let osmRoadSegments = [];
    let osmBuildingPolygons = []; // Array of { coords: [{lat,lng}], centerLat, centerLng }
    let geometryLayers = [];      // All polygons, polylines, badges cleared on re-render
    let routeLayers = [];         // Active multi-segment path, active segment & turn corner markers
    let activeRouteData = null;
    let activeStepIndex = 0;
    let lastOsrmFetch = null;

    // Landmark Pins & Spiderfy state
    let allLandmarkPins = [];
    let activeCategoryFilter = 'ALL';
    let activeSearchQuery = '';
    let selectedPinId = null;
    let expandedClusterKey = null;
    let renderedMarkers = [];
    let spiderLayers = [];

    // User GPS / Custom Origin state
    let userLat = null;
    let userLng = null;
    let userAccuracy = 15;
    let customOrigin = null; // { lat, lng, label } | null
    let googleUserMarker = null;
    let googleUserAccuracyCircle = null;
    let leafletUserMarker = null;
    let leafletUserAccuracyCircle = null;

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function isPointInPolygon(lat, lng, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i].lat, yi = poly[i].lng;
        const xj = poly[j].lat, yj = poly[j].lng;
        const intersect = ((yi > lng) !== (yj > lng)) &&
                          (lat < (xj - xi) * (lng - yi) / ((yj - yi) || 1e-12) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function evaluateCampusContainment(lat, lng) {
      const centerDist = haversineMeters(lat, lng, BBSUTSD_CENTER.lat, BBSUTSD_CENTER.lng);
      if (verifiedOsmBoundary && verifiedOsmBoundary.length >= 3) {
        const inside = isPointInPolygon(lat, lng, verifiedOsmBoundary);
        let minEdgeDist = centerDist;
        verifiedOsmBoundary.forEach(pt => {
          const d = haversineMeters(lat, lng, pt.lat, pt.lng);
          if (d < minEdgeDist) minEdgeDist = d;
        });
        return {
          isInside: inside,
          distanceMeters: inside ? 0 : Math.round(minEdgeDist)
        };
      }
      const inside = centerDist <= CAMPUS_RADIUS_METERS;
      return {
        isInside: inside,
        distanceMeters: inside ? 0 : Math.round(centerDist - CAMPUS_RADIUS_METERS)
      };
    }

    function notifyBoundaryStatus() {
      if (userLat === null || userLng === null) return;
      const status = evaluateCampusContainment(userLat, userLng);
      if (window.AndroidBridge && window.AndroidBridge.onBoundaryStatusChanged) {
        window.AndroidBridge.onBoundaryStatusChanged(status.isInside, status.distanceMeters);
      }
    }

    function clearCampusGeometryOverlays() {
      geometryLayers.forEach(layer => {
        if (typeof layer.removeFn === 'function') {
          layer.removeFn();
        } else if (mapEngine === 'google') {
          layer.setMap(null);
        } else if (mapEngine === 'leaflet' && leafletMap) {
          leafletMap.removeLayer(layer);
        }
      });
      geometryLayers = [];
    }

    function addZoneBadge(lat, lng, text, cssClass) {
      if (mapEngine === 'google' && googleMap) {
        class ZoneBadgeOverlay extends google.maps.OverlayView {
          constructor() {
            super();
            this.div = null;
            this.pos = new google.maps.LatLng(lat, lng);
          }
          onAdd() {
            const el = document.createElement('div');
            el.className = 'zone-badge ' + cssClass;
            el.style.position = 'absolute';
            el.textContent = text;
            this.div = el;
            this.getPanes().overlayLayer.appendChild(el);
          }
          draw() {
            if (!this.div) return;
            const proj = this.getProjection();
            if (!proj) return;
            const pt = proj.fromLatLngToDivPixel(this.pos);
            if (pt) {
              this.div.style.left = pt.x + 'px';
              this.div.style.top = pt.y + 'px';
            }
          }
          onRemove() {
            if (this.div && this.div.parentNode) {
              this.div.parentNode.removeChild(this.div);
              this.div = null;
            }
          }
        }
        const overlay = new ZoneBadgeOverlay();
        overlay.setMap(googleMap);
        geometryLayers.push({ removeFn: () => overlay.setMap(null) });
      } else if (mapEngine === 'leaflet' && leafletMap) {
        const icon = L.divIcon({
          className: 'campus-leaflet-icon',
          html: `<div class="zone-badge is-leaflet ${cssClass}">${escapeHtml(text)}</div>`,
          iconSize: [0, 0],
          iconAnchor: [0, 0]
        });
        const m = L.marker([lat, lng], { icon: icon, interactive: false, zIndexOffset: 50 }).addTo(leafletMap);
        geometryLayers.push(m);
      }
    }

    function addPolygonLayer(coords, strokeColor, fillColor, fillOpacity, strokeWeight, dashArray) {
      if (mapEngine === 'google' && googleMap) {
        const poly = new google.maps.Polygon({
          paths: coords,
          strokeColor: strokeColor,
          strokeOpacity: 0.92,
          strokeWeight: strokeWeight,
          fillColor: fillColor,
          fillOpacity: fillOpacity,
          clickable: false,
          map: googleMap
        });
        geometryLayers.push(poly);
      } else if (mapEngine === 'leaflet' && leafletMap) {
        const poly = L.polygon(
          coords.map(p => [p.lat, p.lng]),
          {
            color: strokeColor,
            weight: strokeWeight,
            opacity: 0.92,
            fillColor: fillColor,
            fillOpacity: fillOpacity,
            dashArray: dashArray || null,
            interactive: false
          }
        ).addTo(leafletMap);
        geometryLayers.push(poly);
      }
    }

    function addPolylineLayer(coords, color, weight, opacity, dashArray) {
      if (mapEngine === 'google' && googleMap) {
        const line = new google.maps.Polyline({
          path: coords,
          strokeColor: color,
          strokeOpacity: opacity,
          strokeWeight: weight,
          clickable: false,
          map: googleMap
        });
        geometryLayers.push(line);
      } else if (mapEngine === 'leaflet' && leafletMap) {
        const line = L.polyline(
          coords.map(p => [p.lat, p.lng]),
          {
            color: color,
            weight: weight,
            opacity: opacity,
            dashArray: dashArray || null,
            interactive: false
          }
        ).addTo(leafletMap);
        geometryLayers.push(line);
      }
    }

    function renderCampusGeometry() {
      if (mapEngine === 'pending') return;
      clearCampusGeometryOverlays();

      // 1. Campus Outer Boundary
      if (verifiedOsmBoundary && verifiedOsmBoundary.length >= 3) {
        addPolygonLayer(verifiedOsmBoundary, '#0B57D0', '#0B57D0', 0.05, 2.5, '8, 6');
      } else {
        if (mapEngine === 'google' && googleMap) {
          geometryLayers.push(new google.maps.Circle({
            center: BBSUTSD_CENTER,
            radius: CAMPUS_RADIUS_METERS,
            strokeColor: '#0B57D0',
            strokeOpacity: 0.75,
            strokeWeight: 2.5,
            fillColor: '#0B57D0',
            fillOpacity: 0.05,
            clickable: false,
            map: googleMap
          }));
        } else if (mapEngine === 'leaflet' && leafletMap) {
          geometryLayers.push(L.circle([BBSUTSD_CENTER.lat, BBSUTSD_CENTER.lng], {
            radius: CAMPUS_RADIUS_METERS,
            color: '#0B57D0',
            weight: 2.5,
            opacity: 0.75,
            dashArray: '8, 6',
            fillColor: '#0B57D0',
            fillOpacity: 0.05,
            interactive: false
          }).addTo(leafletMap));
        }
      }

      // 2. Complex Zone Highlights (subtle outlines so real satellite buildings shine through)
      const zoneFill = isSatelliteMode ? 0.04 : 0.11;
      const bldFill = isSatelliteMode ? 0.06 : 0.18;
      addPolygonLayer(OLD_COMPLEX_ZONE, '#B3261E', '#B3261E', zoneFill, 1.8, '6, 5');
      addPolygonLayer(NEW_COMPLEX_ZONE, '#0F9D58', '#0F9D58', zoneFill, 1.8, '6, 5');

      // 3. Up-to-date OSM Building Footprints inside Campus
      osmBuildingPolygons.forEach(bld => {
        const isOldComplexSide = (bld.centerLat >= 27.51085 || bld.centerLng < 68.74162);
        const color = isOldComplexSide ? '#B3261E' : '#0F9D58';
        addPolygonLayer(bld.coords, color, color, bldFill, 1.5, null);
      });

      // 4. Dividing Campus Road Highlight + Verified OSM Internal/Adjacent Roads
      addPolylineLayer(DIVIDING_ROAD_PATH, '#FFFFFF', isSatelliteMode ? 5 : 7, isSatelliteMode ? 0.45 : 0.85, null);
      addPolylineLayer(DIVIDING_ROAD_PATH, '#0B57D0', 2.5, isSatelliteMode ? 0.65 : 0.85, '10, 6');

      osmRoadSegments.forEach(segment => {
        addPolylineLayer(segment, isSatelliteMode ? '#FEF08A' : '#64748B', 2, isSatelliteMode ? 0.35 : 0.55, null);
      });

      // 5. Clear Zone Badges for Old Complex, Dividing Road, and New Complex
      addZoneBadge(27.51162, 68.74098, 'Old Building Complex', 'zone-badge-old');
      addZoneBadge(27.51083, 68.74163, 'Campus Dividing Road', 'zone-badge-road');
      addZoneBadge(27.51018, 68.74220, 'New Building Complex', 'zone-badge-new');
    }

    function fetchVerifiedOsmCampusGeometry() {
      const query = `[out:json][timeout:12];
        (
          way["amenity"="university"](around:600,${BBSUTSD_CENTER.lat},${BBSUTSD_CENTER.lng});
          relation["amenity"="university"](around:600,${BBSUTSD_CENTER.lat},${BBSUTSD_CENTER.lng});
          way["landuse"="education"](around:600,${BBSUTSD_CENTER.lat},${BBSUTSD_CENTER.lng});
          way["building"](around:480,${BBSUTSD_CENTER.lat},${BBSUTSD_CENTER.lng});
          way["highway"](around:480,${BBSUTSD_CENTER.lat},${BBSUTSD_CENTER.lng});
        );
        out geom;`;

      const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);
      const mirrorUrl = 'https://overpass.kumi.systems/api/interpreter?data=' + encodeURIComponent(query);
      fetch(url)
        .then(res => res.ok ? res.json() : fetch(mirrorUrl).then(r2 => r2.ok ? r2.json() : Promise.reject('OSM HTTP ' + res.status)))
        .then(data => {
          if (!data || !Array.isArray(data.elements)) return;

          let bestPolygon = null;
          const roads = [];
          const buildings = [];

          data.elements.forEach(el => {
            if (el.type === 'way' && Array.isArray(el.geometry) && el.geometry.length >= 2) {
              const tags = el.tags || {};
              if (tags.amenity === 'university' || tags.landuse === 'education') {
                if (el.geometry.length >= 3) {
                  bestPolygon = el.geometry.map(g => ({ lat: g.lat, lng: g.lon }));
                }
              } else if (tags.building) {
                if (el.geometry.length >= 3) {
                  const coords = el.geometry.map(g => ({ lat: g.lat, lng: g.lon }));
                  const avgLat = coords.reduce((s, p) => s + p.lat, 0) / coords.length;
                  const avgLng = coords.reduce((s, p) => s + p.lng, 0) / coords.length;
                  if (haversineMeters(avgLat, avgLng, BBSUTSD_CENTER.lat, BBSUTSD_CENTER.lng) <= 380) {
                    buildings.push({ coords: coords, centerLat: avgLat, centerLng: avgLng });
                  }
                }
              } else if (tags.highway) {
                roads.push(el.geometry.map(g => ({ lat: g.lat, lng: g.lon })));
              }
            }
          });

          verifiedOsmBoundary = bestPolygon;
          osmRoadSegments = roads;
          osmBuildingPolygons = buildings;
          renderCampusGeometry();
          notifyBoundaryStatus();
          if (selectedPinId) updateGuideLine();

          if (window.AndroidBridge && window.AndroidBridge.onOsmDataLoaded) {
            window.AndroidBridge.onOsmDataLoaded(bestPolygon !== null, roads.length, buildings.length);
          }
        })
        .catch(() => {
          if (window.AndroidBridge && window.AndroidBridge.onOsmDataLoaded) {
            window.AndroidBridge.onOsmDataLoaded(false, 0, 0);
          }
        });
    }

    function calculateBearingDeg(lat1, lon1, lat2, lon2) {
      const phi1 = lat1 * Math.PI / 180;
      const phi2 = lat2 * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(dLon) * Math.cos(phi2);
      const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLon);
      return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
    }

    function compassDirLabel(deg) {
      const dirs = ['North', 'North-East', 'East', 'South-East', 'South', 'South-West', 'West', 'North-West'];
      return dirs[Math.round(((deg % 360) / 45)) % 8];
    }

    function classifyTurnDelta(delta) {
      const d = ((delta + 540) % 360) - 180;
      if (Math.abs(d) < 18) return { action: 'STRAIGHT', verb: 'Continue straight' };
      if (d >= 18 && d < 50) return { action: 'KEEP_RIGHT', verb: 'Keep right' };
      if (d >= 50 && d < 125) return { action: 'RIGHT', verb: 'Turn right' };
      if (d >= 125) return { action: 'SHARP_RIGHT', verb: 'Make a sharp right' };
      if (d <= -18 && d > -50) return { action: 'KEEP_LEFT', verb: 'Keep left' };
      if (d <= -50 && d > -125) return { action: 'LEFT', verb: 'Turn left' };
      return { action: 'SHARP_LEFT', verb: 'Make a sharp left' };
    }

    function projectPointOntoSegment(p, a, b) {
      const cosLat = Math.cos(27.5108 * Math.PI / 180);
      const px = p.lng * 111320 * cosLat, py = p.lat * 110810;
      const ax = a.lng * 111320 * cosLat, ay = a.lat * 110810;
      const bx = b.lng * 111320 * cosLat, by = b.lat * 110810;
      const dx = bx - ax, dy = by - ay;
      const lenSq = dx * dx + dy * dy;
      let t = 0;
      if (lenSq > 1e-9) {
        t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lenSq));
      }
      const proj = { lat: a.lat + t * (b.lat - a.lat), lng: a.lng + t * (b.lng - a.lng) };
      return { point: proj, t, distMeters: haversineMeters(p.lat, p.lng, proj.lat, proj.lng) };
    }

    function buildCampusAndOsmGraph() {
      const nodes = {};
      Object.keys(GRAPH_NODES).forEach(k => { nodes[k] = Object.assign({}, GRAPH_NODES[k]); });
      const adj = {};
      Object.keys(nodes).forEach(id => { adj[id] = []; });
      const edges = EDGE_DEFS.slice();
      EDGE_DEFS.forEach(([a, b, streetName]) => {
        if (adj[a]) adj[a].push({ to: b, streetName });
        if (adj[b]) adj[b].push({ to: a, streetName });
      });

      if (osmRoadSegments && osmRoadSegments.length > 0) {
        const osmNodeIds = [];
        const findOrCreateOsmNode = (pt) => {
          for (let i = 0; i < osmNodeIds.length; i++) {
            const id = osmNodeIds[i];
            const n = nodes[id];
            if (haversineMeters(pt.lat, pt.lng, n.lat, n.lng) <= 4.5) return id;
          }
          const newId = 'osm_' + osmNodeIds.length;
          nodes[newId] = { id: newId, lat: pt.lat, lng: pt.lng, label: 'Campus Street' };
          adj[newId] = [];
          osmNodeIds.push(newId);
          return newId;
        };

        osmRoadSegments.forEach(road => {
          if (!road || road.length < 2) return;
          let prevId = null;
          road.forEach(pt => {
            if (haversineMeters(pt.lat, pt.lng, BBSUTSD_CENTER.lat, BBSUTSD_CENTER.lng) > 560 ||
                (pt.lng > 68.74435 && pt.lat < 27.5122)) {
              prevId = null;
              return;
            }
            const curId = findOrCreateOsmNode(pt);
            if (prevId && prevId !== curId && !adj[prevId].some(e => e.to === curId)) {
              adj[prevId].push({ to: curId, streetName: 'Mapped Campus Street' });
              adj[curId].push({ to: prevId, streetName: 'Mapped Campus Street' });
              edges.push([prevId, curId, 'Mapped Campus Street']);
            }
            prevId = curId;
          });
        });

        ['rd_cafeteria_nw','rd_atm_front','rd_library_front','rd_smart_front','rd_west_spine_jct','rd_points_jct','rd_gates_jct'].forEach(aId => {
          const aNode = nodes[aId];
          if (!aNode) return;
          let bestId = null, bestDist = Infinity;
          osmNodeIds.forEach(oId => {
            const d = haversineMeters(aNode.lat, aNode.lng, nodes[oId].lat, nodes[oId].lng);
            if (d < bestDist) { bestDist = d; bestId = oId; }
          });
          if (bestId && bestDist <= 16 && bestDist >= 1.5 && !adj[aId].some(e => e.to === bestId)) {
            adj[aId].push({ to: bestId, streetName: aNode.label });
            adj[bestId].push({ to: aId, streetName: aNode.label });
            edges.push([aId, bestId, aNode.label]);
          }
        });
      }

      return { nodes, adj, edges };
    }

    function attachPointToDynamicGraph(virtualId, coord, approachName, graph, preferredNodeId) {
      const { nodes, adj, edges } = graph;
      nodes[virtualId] = { id: virtualId, lat: coord.lat, lng: coord.lng, label: approachName };
      adj[virtualId] = [];

      if (preferredNodeId && nodes[preferredNodeId]) {
        const pref = nodes[preferredNodeId];
        if (haversineMeters(coord.lat, coord.lng, pref.lat, pref.lng) <= 15) {
          adj[virtualId].push({ to: preferredNodeId, streetName: approachName });
          adj[preferredNodeId].push({ to: virtualId, streetName: approachName });
          return;
        }
      }

      const edgeCandidates = [];
      edges.forEach(([u, v, streetName]) => {
        const nu = nodes[u], nv = nodes[v];
        if (!nu || !nv) return;
        const res = projectPointOntoSegment(coord, nu, nv);
        edgeCandidates.push({ u, v, streetName, proj: res.point, t: res.t, distMeters: res.distMeters });
      });

      edgeCandidates.sort((a, b) => a.distMeters - b.distMeters);
      const closestDist = edgeCandidates[0] ? edgeCandidates[0].distMeters : 0;
      const topEdges = edgeCandidates.filter((c, i) => i < 2 && (i === 0 || c.distMeters <= Math.min(18, closestDist + 6)));

      topEdges.forEach((cand, idx) => {
        if (cand.t <= 0.04) {
          adj[virtualId].push({ to: cand.u, streetName: approachName });
          if (adj[cand.u]) adj[cand.u].push({ to: virtualId, streetName: approachName });
        } else if (cand.t >= 0.96) {
          adj[virtualId].push({ to: cand.v, streetName: approachName });
          if (adj[cand.v]) adj[cand.v].push({ to: virtualId, streetName: approachName });
        } else {
          const splitId = `${virtualId}_proj_${idx}`;
          nodes[splitId] = { id: splitId, lat: cand.proj.lat, lng: cand.proj.lng, label: cand.streetName };
          adj[splitId] = [
            { to: cand.u, streetName: cand.streetName },
            { to: cand.v, streetName: cand.streetName },
            { to: virtualId, streetName: approachName }
          ];
          if (adj[cand.u]) adj[cand.u].push({ to: splitId, streetName: cand.streetName });
          if (adj[cand.v]) adj[cand.v].push({ to: splitId, streetName: cand.streetName });
          adj[virtualId].push({ to: splitId, streetName: approachName });
        }
      });
    }

    function solveShortestDynamicDijkstra(originLat, originLng, originLabel, pin) {
      const graph = buildCampusAndOsmGraph();
      const { nodes, adj } = graph;

      const startId = '__start__';
      const endId = '__end__';
      const matchingOriginPin = allLandmarkPins.find(p => haversineMeters(originLat, originLng, p.lat, p.lng) <= 8);
      attachPointToDynamicGraph(
        startId,
        { lat: originLat, lng: originLng },
        'Walkway from ' + (originLabel || 'Your Location'),
        graph,
        matchingOriginPin ? PIN_TO_NODE[matchingOriginPin.id] : undefined
      );
      attachPointToDynamicGraph(endId, { lat: pin.lat, lng: pin.lng }, (pin.label || pin.name) + ' Entrance', graph, PIN_TO_NODE[pin.id]);

      Object.keys(nodes).forEach(sId => {
        if (!sId.startsWith('__start___proj_')) return;
        Object.keys(nodes).forEach(eId => {
          if (!eId.startsWith('__end___proj_')) return;
          const sN = (adj[sId] || []).map(x => x.to).filter(x => x !== startId);
          const eN = (adj[eId] || []).map(x => x.to).filter(x => x !== endId);
          if (sN.length === 2 && eN.length === 2 &&
              ((sN[0] === eN[0] && sN[1] === eN[1]) || (sN[0] === eN[1] && sN[1] === eN[0]))) {
            adj[sId].push({ to: eId, streetName: nodes[sId].label });
            adj[eId].push({ to: sId, streetName: nodes[eId].label });
          }
        });
      });

      const dist = {};
      const prev = {};
      const unvisited = new Set(Object.keys(nodes));
      unvisited.forEach(id => { dist[id] = Infinity; prev[id] = null; });
      dist[startId] = 0;

      while (unvisited.size > 0) {
        let curr = null;
        let smallest = Infinity;
        unvisited.forEach(id => {
          if (dist[id] < smallest) { smallest = dist[id]; curr = id; }
        });
        if (!curr || curr === endId || smallest === Infinity) break;
        unvisited.delete(curr);

        const cNode = nodes[curr];
        (adj[curr] || []).forEach(edge => {
          if (!unvisited.has(edge.to)) return;
          const tNode = nodes[edge.to];
          const w = haversineMeters(cNode.lat, cNode.lng, tNode.lat, tNode.lng);
          const alt = dist[curr] + w;
          if (alt < dist[edge.to]) {
            dist[edge.to] = alt;
            prev[edge.to] = { id: curr, streetName: edge.streetName };
          }
        });
      }

      const nodeIds = [];
      const edgeNames = [];
      let cur = endId;
      while (cur) {
        nodeIds.unshift(cur);
        const p = prev[cur];
        if (p) { edgeNames.unshift(p.streetName); cur = p.id; }
        else cur = null;
      }
      return {
        points: nodeIds.map(id => ({ lat: nodes[id].lat, lng: nodes[id].lng })),
        segNames: edgeNames
      };
    }

    function isOutsideCampusCoord(lat, lng) {
      const centerDist = haversineMeters(lat, lng, BBSUTSD_CENTER.lat, BBSUTSD_CENTER.lng);
      if (centerDist > 350 || lat < 27.50995 || lat > 27.51335 || lng < 68.7402 || lng > 68.74495) {
        return true;
      }
      if (verifiedOsmBoundary && verifiedOsmBoundary.length >= 3) {
        const insidePoly = isPointInPolygon(lat, lng, verifiedOsmBoundary);
        if (!insidePoly && centerDist > 260) {
          const nearManual = allLandmarkPins.some(p => haversineMeters(lat, lng, p.lat, p.lng) <= 35);
          if (!nearManual) return true;
        }
      }
      return false;
    }

    function computeWalkableCampusRoute(originLat, originLng, originLabel, pin) {
      const destCoord = { lat: pin.lat, lng: pin.lng };
      const directDist = haversineMeters(originLat, originLng, destCoord.lat, destCoord.lng);

      let rawPoints = [];
      let rawNames = [];
      if (directDist <= 28) {
        rawPoints = [{ lat: originLat, lng: originLng }, destCoord];
        rawNames = ['Walk directly to ' + (pin.label || pin.name)];
      } else if (isOutsideCampusCoord(originLat, originLng)) {
        const gatePin = allLandmarkPins.find(p => p.id === 'gate_main') || { lat: 27.510977, lng: 68.743880 };
        if (pin.id === 'gate_main') {
          rawPoints = [{ lat: originLat, lng: originLng }, { lat: gatePin.lat, lng: gatePin.lng }];
          rawNames = ['Approach Road to Main Gates'];
        } else {
          const fromGate = solveShortestDynamicDijkstra(gatePin.lat, gatePin.lng, 'Main Gates (Old & New Buildings)', pin);
          rawPoints = [{ lat: originLat, lng: originLng }].concat(fromGate.points);
          rawNames = ['Approach Road to Main Gates'].concat(fromGate.segNames);
        }
      } else {
        const solved = solveShortestDynamicDijkstra(originLat, originLng, originLabel, pin);
        rawPoints = solved.points;
        rawNames = solved.segNames;
      }

      const cleanedPoints = [];
      const cleanedNames = [];
      for (let i = 0; i < rawPoints.length; i++) {
        const pt = rawPoints[i];
        if (cleanedPoints.length === 0) {
          cleanedPoints.push(pt);
        } else {
          const prevPt = cleanedPoints[cleanedPoints.length - 1];
          const d = haversineMeters(prevPt.lat, prevPt.lng, pt.lat, pt.lng);
          if (d >= 2.0 || i === rawPoints.length - 1) {
            cleanedPoints.push(pt);
            cleanedNames.push(rawNames[i - 1] || 'Campus Walkway');
          }
        }
      }

      if (cleanedPoints.length < 2) {
        cleanedPoints.push(destCoord);
        cleanedNames.push('Immediate Arrival');
      }

      const segs = [];
      let totalDist = 0;
      for (let i = 0; i < cleanedPoints.length - 1; i++) {
        const a = cleanedPoints[i], b = cleanedPoints[i + 1];
        const d = haversineMeters(a.lat, a.lng, b.lat, b.lng);
        if (d < 1.5 && cleanedPoints.length > 2) continue;
        totalDist += d;
        segs.push({
          from: a, to: b, dist: d,
          bearing: calculateBearingDeg(a.lat, a.lng, b.lat, b.lng),
          streetName: cleanedNames[i] || 'Campus Walkway'
        });
      }

      const steps = [];
      if (segs.length > 0) {
        let curCoords = [segs[0].from, segs[0].to];
        let curDist = segs[0].dist;
        let curStreet = segs[0].streetName;
        let curBearing = segs[0].bearing;
        let pendingAction = 'START';
        let pendingVerb = 'Head ' + compassDirLabel(curBearing);

        const flush = () => {
          const r = Math.max(1, Math.round(curDist));
          const text = pendingAction === 'START'
            ? `${pendingVerb} along ${curStreet} for ${r} m`
            : `${pendingVerb} onto ${curStreet} • ${r} m`;
          steps.push({
            action: pendingAction,
            instruction: text,
            streetName: curStreet,
            distanceMeters: r,
            coord: curCoords[0],
            segmentCoords: curCoords.slice()
          });
        };

        for (let i = 1; i < segs.length; i++) {
          const nxt = segs[i];
          const turn = classifyTurnDelta(nxt.bearing - curBearing);
          if (turn.action === 'STRAIGHT' && (nxt.streetName === curStreet || nxt.dist < 5)) {
            curCoords.push(nxt.to);
            curDist += nxt.dist;
            curBearing = nxt.bearing;
          } else {
            flush();
            pendingAction = turn.action;
            pendingVerb = turn.verb;
            curStreet = nxt.streetName;
            curCoords = [nxt.from, nxt.to];
            curDist = nxt.dist;
            curBearing = nxt.bearing;
          }
        }
        flush();
      }

      steps.push({
        action: 'ARRIVE',
        instruction: `Arrive at ${pin.name}`,
        streetName: 'Destination',
        distanceMeters: 0,
        coord: destCoord,
        segmentCoords: [destCoord]
      });

      const roundedTotal = Math.round(totalDist);
      return {
        polyline: cleanedPoints,
        steps: steps,
        totalDistanceMeters: roundedTotal,
        estimatedMinutes: Math.max(1, Math.round(roundedTotal / 75))
      };
    }

    function clearRouteLayers() {
      routeLayers.forEach(layer => {
        if (typeof layer.removeFn === 'function') layer.removeFn();
        else if (mapEngine === 'google') layer.setMap(null);
        else if (mapEngine === 'leaflet' && leafletMap) leafletMap.removeLayer(layer);
      });
      routeLayers = [];
    }

    function drawRenderedRoute(route) {
      clearRouteLayers();
      activeRouteData = route;
      if (activeStepIndex >= route.steps.length) {
        activeStepIndex = Math.max(0, route.steps.length - 1);
      }

      if (window.AndroidBridge && window.AndroidBridge.onRouteCalculated) {
        window.AndroidBridge.onRouteCalculated(JSON.stringify({
          totalDistanceMeters: route.totalDistanceMeters,
          estimatedMinutes: route.estimatedMinutes,
          steps: route.steps.map(s => ({
            action: s.action,
            instruction: s.instruction,
            streetName: s.streetName,
            distanceMeters: s.distanceMeters
          }))
        }));
      }

      if (mapEngine === 'google' && googleMap) {
        routeLayers.push(new google.maps.Polyline({
          path: route.polyline,
          strokeColor: '#FFFFFF',
          strokeOpacity: 0.95,
          strokeWeight: 8,
          clickable: false,
          map: googleMap
        }));
        routeLayers.push(new google.maps.Polyline({
          path: route.polyline,
          strokeColor: '#0B57D0',
          strokeOpacity: 0.96,
          strokeWeight: 5,
          clickable: false,
          map: googleMap
        }));
        const curStep = route.steps[activeStepIndex];
        if (curStep && curStep.segmentCoords && curStep.segmentCoords.length >= 2) {
          routeLayers.push(new google.maps.Polyline({
            path: curStep.segmentCoords,
            strokeColor: '#0F9D58',
            strokeOpacity: 0.98,
            strokeWeight: 6.5,
            clickable: false,
            map: googleMap
          }));
        }
      } else if (mapEngine === 'leaflet' && leafletMap) {
        const latLngs = route.polyline.map(p => [p.lat, p.lng]);
        routeLayers.push(L.polyline(latLngs, {
          color: '#FFFFFF',
          weight: 8,
          opacity: 0.95,
          interactive: false
        }).addTo(leafletMap));
        routeLayers.push(L.polyline(latLngs, {
          color: '#0B57D0',
          weight: 5,
          opacity: 0.96,
          interactive: false
        }).addTo(leafletMap));

        const curStep = route.steps[activeStepIndex];
        if (curStep && curStep.segmentCoords && curStep.segmentCoords.length >= 2) {
          routeLayers.push(L.polyline(curStep.segmentCoords.map(p => [p.lat, p.lng]), {
            color: '#0F9D58',
            weight: 6.5,
            opacity: 0.98,
            interactive: false
          }).addTo(leafletMap));
        }

        route.steps.forEach((step, idx) => {
          if (step.action === 'ARRIVE') return;
          const active = idx === activeStepIndex;
          const badge = L.divIcon({
            className: 'campus-leaflet-icon',
            html: `<div style="min-width:22px;height:22px;padding:0 5px;border-radius:9999px;background:${active ? '#0B57D0' : '#FFFFFF'};color:${active ? '#FFFFFF' : '#0B57D0'};border:2px solid ${active ? '#FFFFFF' : '#0B57D0'};font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(15,23,42,0.22);">${idx + 1}</div>`,
            iconSize: [0, 0],
            iconAnchor: [0, 0]
          });
          routeLayers.push(L.marker([step.coord.lat, step.coord.lng], {
            icon: badge,
            interactive: false,
            zIndexOffset: active ? 970 : 740
          }).addTo(leafletMap));
        });
      }
    }

    function updateGuideLine() {
      if (!selectedPinId) {
        clearRouteLayers();
        activeRouteData = null;
        if (window.AndroidBridge && window.AndroidBridge.onRouteCalculated) {
          window.AndroidBridge.onRouteCalculated('');
        }
        return;
      }
      const pin = allLandmarkPins.find(p => p.id === selectedPinId);
      if (!pin) return;

      const gatePin = allLandmarkPins.find(p => p.id === 'gate_main') || { lat: 27.510977, lng: 68.743880 };
      const origLat = customOrigin ? customOrigin.lat : (userLat !== null ? userLat : gatePin.lat);
      const origLng = customOrigin ? customOrigin.lng : (userLng !== null ? userLng : gatePin.lng);
      const origLabel = customOrigin ? customOrigin.label : (userLat !== null ? 'Your Live GPS' : 'Main Gates (Old & New Buildings)');

      const localRoute = computeWalkableCampusRoute(origLat, origLng, origLabel, pin);
      drawRenderedRoute(localRoute);

      const directDist = haversineMeters(origLat, origLng, pin.lat, pin.lng);
      const distFromCampus = haversineMeters(origLat, origLng, BBSUTSD_CENTER.lat, BBSUTSD_CENTER.lng);
      const isOutsideCampus = isOutsideCampusCoord(origLat, origLng);
      if (isOutsideCampus && directDist > 38 && distFromCampus <= 50000) {
        if (lastOsrmFetch && lastOsrmFetch.pinId === pin.id &&
            haversineMeters(lastOsrmFetch.lat, lastOsrmFetch.lng, origLat, origLng) < 12 &&
            lastOsrmFetch.route) {
          drawRenderedRoute(lastOsrmFetch.route);
          return;
        }
        // Outside approaches ALWAYS calculate road path strictly to Main Gates first
        const osrmUrl = `https://router.project-osrm.org/route/v1/foot/${origLng},${origLat};${gatePin.lng},${gatePin.lat}?overview=full&geometries=geojson&steps=true`;
        const reqOrigin = { lat: origLat, lng: origLng, pinId: pin.id };
        fetch(osrmUrl)
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (!data || !data.routes || !data.routes[0]) return;
            if (selectedPinId !== reqOrigin.pinId) return;
            const osrm = data.routes[0];
            const roadPolyline = (osrm.geometry?.coordinates || []).map(c => ({ lat: c[1], lng: c[0] }));
            if (roadPolyline.length < 2) return;
            const fullPolyline = [];
            if (haversineMeters(reqOrigin.lat, reqOrigin.lng, roadPolyline[0].lat, roadPolyline[0].lng) > 3) {
              fullPolyline.push({ lat: reqOrigin.lat, lng: reqOrigin.lng });
            }
            roadPolyline.forEach(pt => fullPolyline.push(pt));

            const roadSteps = [];
            const legs = osrm.legs && osrm.legs[0];
            if (legs && Array.isArray(legs.steps)) {
              legs.steps.forEach((s, idx) => {
                if (s.maneuver?.type === 'arrive') return;
                const mod = s.maneuver?.modifier || '';
                const segCoords = (s.geometry?.coordinates && s.geometry.coordinates.length >= 2)
                  ? s.geometry.coordinates.map(c => ({ lat: c[1], lng: c[0] }))
                  : (s.maneuver?.location ? [{ lat: s.maneuver.location[1], lng: s.maneuver.location[0] }] : [{ lat: reqOrigin.lat, lng: reqOrigin.lng }]);

                let action = idx === 0 ? 'START' : 'STRAIGHT';
                let verb = 'Continue straight';
                if (idx === 0) {
                  const b = segCoords.length >= 2
                    ? calculateBearingDeg(segCoords[0].lat, segCoords[0].lng, segCoords[1].lat, segCoords[1].lng)
                    : calculateBearingDeg(reqOrigin.lat, reqOrigin.lng, gatePin.lat, gatePin.lng);
                  verb = 'Head ' + compassDirLabel(b);
                } else {
                  if (mod.includes('sharp right')) { action = 'SHARP_RIGHT'; verb = 'Make a sharp right'; }
                  else if (mod.includes('slight right')) { action = 'KEEP_RIGHT'; verb = 'Keep right'; }
                  else if (mod.includes('right')) { action = 'RIGHT'; verb = 'Turn right'; }
                  else if (mod.includes('sharp left')) { action = 'SHARP_LEFT'; verb = 'Make a sharp left'; }
                  else if (mod.includes('slight left')) { action = 'KEEP_LEFT'; verb = 'Keep left'; }
                  else if (mod.includes('left')) { action = 'LEFT'; verb = 'Turn left'; }
                }
                const loc = s.maneuver?.location;
                const pt = loc ? { lat: loc[1], lng: loc[0] } : segCoords[0];
                const rName = (s.name && s.name.trim()) ? s.name : 'City Approach Road';
                const rDist = Math.round(s.distance || 0);
                roadSteps.push({
                  action,
                  instruction: `${verb} onto ${rName} • ${rDist} m`,
                  streetName: rName,
                  distanceMeters: rDist,
                  coord: pt,
                  segmentCoords: segCoords
                });
              });
            }

            if (pin.id === 'gate_main') {
              roadSteps.push({
                action: 'ARRIVE',
                instruction: `Arrive at ${pin.name}`,
                streetName: 'Destination',
                distanceMeters: 0,
                coord: { lat: gatePin.lat, lng: gatePin.lng },
                segmentCoords: [{ lat: gatePin.lat, lng: gatePin.lng }]
              });
              const mergedDist = Math.round(osrm.distance || 0);
              const combined = {
                polyline: fullPolyline,
                steps: roadSteps,
                totalDistanceMeters: mergedDist,
                estimatedMinutes: Math.max(1, Math.round(mergedDist / 75))
              };
              lastOsrmFetch = { pinId: reqOrigin.pinId, lat: reqOrigin.lat, lng: reqOrigin.lng, route: combined };
              drawRenderedRoute(combined);
              return;
            }

            const campusPart = computeWalkableCampusRoute(gatePin.lat, gatePin.lng, 'Main Gates (Old & New Buildings)', pin);
            const mergedDist = Math.round((osrm.distance || 0) + campusPart.totalDistanceMeters);
            const combined = {
              polyline: fullPolyline.concat(campusPart.polyline),
              steps: roadSteps.concat(campusPart.steps),
              totalDistanceMeters: mergedDist,
              estimatedMinutes: Math.max(1, Math.round(mergedDist / 75))
            };
            lastOsrmFetch = { pinId: reqOrigin.pinId, lat: reqOrigin.lat, lng: reqOrigin.lng, route: combined };
            drawRenderedRoute(combined);
          })
          .catch(() => {});
      }
    }

      switch (pin.category) {

        case 'STUDENT_SERVICE': return '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>';
        case 'LAB': return '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M9 2v2"/><path d="M15 20v2"/><path d="M9 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/></svg>';

    function clearSpiderLayers() {
      spiderLayers.forEach(layer => {
        if (typeof layer.removeFn === 'function') {
          layer.removeFn();
        } else if (mapEngine === 'google') {
          layer.setMap(null);
        } else if (mapEngine === 'leaflet' && leafletMap) {
          leafletMap.removeLayer(layer);
        }
      });
      spiderLayers = [];
    }

    function groupOverlappingPins(pins, thresholdMeters = 6) {
      const clusters = [];
      pins.forEach(pin => {
        let matched = null;
        for (let i = 0; i < clusters.length; i++) {
          const c = clusters[i];
          if (haversineMeters(pin.lat, pin.lng, c.anchor.lat, c.anchor.lng) <= thresholdMeters) {
            matched = c;
            break;
          }
        }
        if (matched) {
          matched.pins.push(pin);
          const count = matched.pins.length;
          matched.anchor = {
            lat: matched.pins.reduce((s, p) => s + p.lat, 0) / count,
            lng: matched.pins.reduce((s, p) => s + p.lng, 0) / count
          };
        } else {
          clusters.push({
            key: `${pin.lat.toFixed(6)},${pin.lng.toFixed(6)}`,
            anchor: { lat: pin.lat, lng: pin.lng },
            pins: [pin]
          });
        }
      });
      return clusters;
    }

    function computeCircleOffsets(count) {
      if (count <= 0) return [];
      if (count === 1) return [{ x: 0, y: 0, angleRad: 0 }];
      const radiusPx = count === 2 ? 54 : Math.min(92, 46 + count * 8);
      const startAngle = count === 2 ? Math.PI : -Math.PI / 2;
      const res = [];
      for (let idx = 0; idx < count; idx++) {
        const angleRad = startAngle + (2 * Math.PI * idx) / count;
        res.push({
          x: Math.cos(angleRad) * radiusPx,
          y: Math.sin(angleRad) * radiusPx,
          angleRad
        });
      }
      return res;
    }

    function findClusterKeyForPin(clusters, pinId) {
      if (!pinId) return null;
      const found = clusters.find(c => c.pins.length >= 2 && c.pins.some(p => p.id === pinId));
      return found ? found.key : null;
    }

    function offsetLatLngByPixels(anchor, dx, dy, zoom) {
      const scale = 256 * Math.pow(2, zoom || 17);
      const wx = ((anchor.lng + 180) / 360) * scale + dx;
      const sinLat = Math.sin(anchor.lat * Math.PI / 180);
      const wy = (0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI)) * scale + dy;
      const lng = (wx / scale) * 360 - 180;
      const n = Math.PI - (2 * Math.PI * wy) / scale;
      const lat = (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
      return { lat, lng };
    }

    function getCurrentMapZoom() {
      if (mapEngine === 'google' && googleMap) return googleMap.getZoom() || 17;
      if (mapEngine === 'leaflet' && leafletMap) return leafletMap.getZoom() || 17;
      return 17;
    }

    function handlePinTap(pin) {
      selectedPinId = pin.id;
      activeStepIndex = 0;
      renderedMarkers.forEach(m => {
        if (typeof m.setSelectedFn === 'function') {
          m.setSelectedFn(m.id === selectedPinId);
        }
      });
      updateGuideLine();
      if (window.AndroidBridge && window.AndroidBridge.onPinSelected) {
        window.AndroidBridge.onPinSelected(pin.id);
      }
    }

    function createGooglePinOverlay(pin, color, overridePos, isSpiderChild) {
      const lat = overridePos ? overridePos.lat : pin.lat;
      const lng = overridePos ? overridePos.lng : pin.lng;
      class CampusPinOverlay extends google.maps.OverlayView {
        constructor() {
          super();
          this.div = null;
          this.pos = new google.maps.LatLng(lat, lng);
        }
        onAdd() {
          const el = document.createElement('div');
          el.className = 'campus-pin' +
            (isSpiderChild ? ' is-spider-child' : '') +
            (pin.id === selectedPinId ? ' is-selected' : '');
          el.style.setProperty('--pin-color', color);
          el.style.position = 'absolute';
          el.innerHTML = `<div class="campus-pin-label">${escapeHtml(pin.label)}</div><div class="campus-pin-icon">${getCategoryPinSvg(pin)}</div>`;
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            handlePinTap(pin);
          });
          this.div = el;
          this.getPanes().overlayMouseTarget.appendChild(el);
        }
        draw() {
          if (!this.div) return;
          const proj = this.getProjection();
          if (!proj) return;
          const pt = proj.fromLatLngToDivPixel(this.pos);
          if (pt) {
            this.div.style.left = pt.x + 'px';
            this.div.style.top = pt.y + 'px';
          }
        }
        onRemove() {
          if (this.div && this.div.parentNode) {
            this.div.parentNode.removeChild(this.div);
            this.div = null;
          }
        }
        setSelected(selected) {
          if (this.div) {
            this.div.classList.toggle('is-selected', selected);
          }
        }
      }

      const overlay = new CampusPinOverlay();
      overlay.setMap(googleMap);
      return {
        id: pin.id,
        removeFn: () => overlay.setMap(null),
        setSelectedFn: (sel) => overlay.setSelected(sel)
      };
    }

    function createLeafletPinMarker(pin, color, overridePos, isSpiderChild) {
      const lat = overridePos ? overridePos.lat : pin.lat;
      const lng = overridePos ? overridePos.lng : pin.lng;
      const html = `<div class="campus-pin is-leaflet${isSpiderChild ? ' is-spider-child' : ''}${pin.id === selectedPinId ? ' is-selected' : ''}" style="--pin-color:${color}">
        <div class="campus-pin-label">${escapeHtml(pin.label)}</div>
        <div class="campus-pin-icon">${getCategoryPinSvg(pin)}</div>
      </div>`;

      const icon = L.divIcon({
        className: 'campus-leaflet-icon',
        html: html,
        iconSize: [0, 0],
        iconAnchor: [0, 0]
      });

      const marker = L.marker([lat, lng], {
        icon: icon,
        zIndexOffset: pin.id === selectedPinId ? 900 : (isSpiderChild ? 860 : 200)
      }).addTo(leafletMap);

      marker.on('click', (ev) => {
        if (ev && ev.originalEvent) L.DomEvent.stopPropagation(ev.originalEvent);
        handlePinTap(pin);
      });

      return {
        id: pin.id,
        removeFn: () => { if (leafletMap) leafletMap.removeLayer(marker); },
        setSelectedFn: (sel) => {
          const el = marker.getElement();
          if (el) {
            const inner = el.querySelector('.campus-pin');
            if (inner) inner.classList.toggle('is-selected', sel);
          }
          marker.setZIndexOffset(sel ? 900 : (isSpiderChild ? 860 : 200));
        }
      };
    }

    function renderClusterHub(cluster) {
      const stackSvg = '<svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/></svg>';
      const count = cluster.pins.length;
      const html = `<div class="campus-spider-hub">
        <div class="campus-pin-label">${count} places • Tap to fan out</div>
        <div class="campus-spider-hub-circle">${stackSvg}<span class="campus-spider-count">${count}</span></div>
      </div>`;

      if (mapEngine === 'google' && googleMap) {
        class HubOverlay extends google.maps.OverlayView {
          constructor() {
            super();
            this.div = null;
            this.pos = new google.maps.LatLng(cluster.anchor.lat, cluster.anchor.lng);
          }
          onAdd() {
            const el = document.createElement('div');
            el.style.position = 'absolute';
            el.innerHTML = html;
            el.addEventListener('click', (e) => {
              e.stopPropagation();
              expandedClusterKey = cluster.key;
              renderLandmarkMarkers();
            });
            this.div = el;
            this.getPanes().overlayMouseTarget.appendChild(el);
          }
          draw() {
            if (!this.div) return;
            const proj = this.getProjection();
            if (!proj) return;
            const pt = proj.fromLatLngToDivPixel(this.pos);
            if (pt) {
              this.div.style.left = pt.x + 'px';
              this.div.style.top = pt.y + 'px';
            }
          }
          onRemove() {
            if (this.div && this.div.parentNode) {
              this.div.parentNode.removeChild(this.div);
              this.div = null;
            }
          }
        }
        const ov = new HubOverlay();
        ov.setMap(googleMap);
        renderedMarkers.push({ id: '__cluster_' + cluster.key, removeFn: () => ov.setMap(null), setSelectedFn: () => {} });
      } else if (mapEngine === 'leaflet' && leafletMap) {
        const icon = L.divIcon({ className: 'campus-leaflet-icon', html, iconSize: [0, 0], iconAnchor: [0, 0] });
        const marker = L.marker([cluster.anchor.lat, cluster.anchor.lng], { icon, zIndexOffset: 650 }).addTo(leafletMap);
        marker.on('click', (ev) => {
          if (ev && ev.originalEvent) L.DomEvent.stopPropagation(ev.originalEvent);
          expandedClusterKey = cluster.key;
          renderLandmarkMarkers();
        });
        renderedMarkers.push({
          id: '__cluster_' + cluster.key,
          removeFn: () => { if (leafletMap) leafletMap.removeLayer(marker); },
          setSelectedFn: () => {}
        });
      }
    }

    function renderExpandedCluster(cluster) {
      const zoom = getCurrentMapZoom();
      const offsets = computeCircleOffsets(cluster.pins.length);
      const fannedPoints = cluster.pins.map((pin, idx) => {
        const off = offsets[idx] || { x: 0, y: 0 };
        const pos = offsetLatLngByPixels(cluster.anchor, off.x, off.y, zoom);
        return { pin, pos };
      });

      // Draw spider legs from shared anchor to fanned pins
      if (mapEngine === 'google' && googleMap) {
        fannedPoints.forEach(({ pos }) => {
          const line = new google.maps.Polyline({
            path: [cluster.anchor, pos],
            strokeColor: '#7C4D2B',
            strokeOpacity: 0.72,
            strokeWeight: 2,
            clickable: false,
            map: googleMap
          });
          spiderLayers.push(line);
        });

        class AnchorCollapseOverlay extends google.maps.OverlayView {
          constructor() {
            super();
            this.div = null;
            this.pos = new google.maps.LatLng(cluster.anchor.lat, cluster.anchor.lng);
          }
          onAdd() {
            const el = document.createElement('div');
            el.style.position = 'absolute';
            el.innerHTML = '<div class="campus-spider-anchor" title="Collapse spread pins">&times;</div>';
            el.addEventListener('click', (e) => {
              e.stopPropagation();
              expandedClusterKey = null;
              renderLandmarkMarkers();
            });
            this.div = el;
            this.getPanes().overlayMouseTarget.appendChild(el);
          }
          draw() {
            if (!this.div) return;
            const proj = this.getProjection();
            if (!proj) return;
            const pt = proj.fromLatLngToDivPixel(this.pos);
            if (pt) {
              this.div.style.left = pt.x + 'px';
              this.div.style.top = pt.y + 'px';
            }
          }
          onRemove() {
            if (this.div && this.div.parentNode) {
              this.div.parentNode.removeChild(this.div);
              this.div = null;
            }
          }
        }
        const anchorOv = new AnchorCollapseOverlay();
        anchorOv.setMap(googleMap);
        spiderLayers.push({ removeFn: () => anchorOv.setMap(null) });
      } else if (mapEngine === 'leaflet' && leafletMap) {
        fannedPoints.forEach(({ pos }) => {
          const leg = L.polyline([[cluster.anchor.lat, cluster.anchor.lng], [pos.lat, pos.lng]], {
            color: '#7C4D2B',
            weight: 2,
            opacity: 0.72,
            dashArray: '4 4',
            interactive: false
          }).addTo(leafletMap);
          spiderLayers.push(leg);
        });

        const anchorIcon = L.divIcon({
          className: 'campus-leaflet-icon',
          html: '<div class="campus-spider-anchor" title="Collapse spread pins">&times;</div>',
          iconSize: [0, 0],
          iconAnchor: [0, 0]
        });
        const anchorMarker = L.marker([cluster.anchor.lat, cluster.anchor.lng], {
          icon: anchorIcon,
          zIndexOffset: 910
        }).addTo(leafletMap);
        anchorMarker.on('click', (ev) => {
          if (ev && ev.originalEvent) L.DomEvent.stopPropagation(ev.originalEvent);
          expandedClusterKey = null;
          renderLandmarkMarkers();
        });
        spiderLayers.push(anchorMarker);
      }

      fannedPoints.forEach(({ pin, pos }) => {
        const color = CATEGORY_COLORS[pin.category] || '#0B57D0';
        if (mapEngine === 'google' && googleMap) {
          renderedMarkers.push(createGooglePinOverlay(pin, color, pos, true));
        } else if (mapEngine === 'leaflet' && leafletMap) {
          renderedMarkers.push(createLeafletPinMarker(pin, color, pos, true));
        }
      });
    }

    function renderLandmarkMarkers() {
      if (mapEngine === 'pending') return;
      clearLandmarkMarkers();
      clearSpiderLayers();

      const visiblePins = allLandmarkPins.filter(matchesActiveFilters);
      const clusters = groupOverlappingPins(visiblePins, 6);

      if (expandedClusterKey && !clusters.some(c => c.key === expandedClusterKey && c.pins.length >= 2)) {
        expandedClusterKey = null;
      }

      clusters.forEach(cluster => {
        if (cluster.pins.length >= 2) {
          if (expandedClusterKey === cluster.key) {
            renderExpandedCluster(cluster);
          } else {
            renderClusterHub(cluster);
          }
        } else {
          const pin = cluster.pins[0];
          const color = CATEGORY_COLORS[pin.category] || '#0B57D0';
          if (mapEngine === 'google' && googleMap) {
            renderedMarkers.push(createGooglePinOverlay(pin, color, null, false));
          } else if (mapEngine === 'leaflet' && leafletMap) {
            renderedMarkers.push(createLeafletPinMarker(pin, color, null, false));
          }
        }
      });
    }

    // --- Map Engine Init ---
    function initGoogleMaps() {
      try {
        mapEngine = 'google';
        const cleanStyles = [
          { featureType: 'poi', stylers: [{ visibility: 'off' }] },
          { featureType: 'transit', stylers: [{ visibility: 'off' }] }
        ];

        googleMap = new google.maps.Map(document.getElementById('google-map'), {
          center: BBSUTSD_CENTER,
          zoom: 17,
          minZoom: 15,
          maxZoom: 21,
          mapTypeId: isSatelliteMode ? google.maps.MapTypeId.HYBRID : google.maps.MapTypeId.ROADMAP,
          styles: cleanStyles,
          disableDefaultUI: true,
          gestureHandling: 'greedy',
          restriction: {
            latLngBounds: RESTRICT_BOUNDS,
            strictBounds: false
          }
        });

        googleMap.addListener('click', () => {
          if (expandedClusterKey) {
            expandedClusterKey = null;
            renderLandmarkMarkers();
          }
          if (selectedPinId) {
            window.clearSelectedPin();
            if (window.AndroidBridge && window.AndroidBridge.onPinSelected) {
              window.AndroidBridge.onPinSelected('');
            }
          }
        });

        googleMap.addListener('zoom_changed', () => {
          syncZoomLabels(googleMap.getZoom());
          if (expandedClusterKey) renderLandmarkMarkers();
        });
        syncZoomLabels(googleMap.getZoom());

        renderCampusGeometry();
        renderLandmarkMarkers();
        if (allLandmarkPins.length >= 2 && !selectedPinId) {
          fitAllCampusPins(false);
        }
        if (userLat !== null && userLng !== null) {
          drawOrUpdateUserMarker();
        }
        if (window.AndroidBridge && window.AndroidBridge.onMapEngineReady) {
          window.AndroidBridge.onMapEngineReady('google');
        }
      } catch (e) {
        initLeafletMap();
      }
    }

    function initLeafletMap() {
      if (mapEngine === 'leaflet') return;
      mapEngine = 'leaflet';
      document.getElementById('google-map').style.display = 'none';
      document.getElementById('leaflet-map').style.display = 'block';

      const bounds = L.latLngBounds(
        [RESTRICT_BOUNDS.south, RESTRICT_BOUNDS.west],
        [RESTRICT_BOUNDS.north, RESTRICT_BOUNDS.east]
      );

      leafletMap = L.map('leaflet-map', {
        center: [BBSUTSD_CENTER.lat, BBSUTSD_CENTER.lng],
        zoom: 17,
        minZoom: 15,
        maxZoom: 21,
        maxBounds: bounds,
        maxBoundsViscosity: 0.9,
        zoomControl: false,
        attributionControl: false
      });

      leafletSatLayer = L.tileLayer(
        'https://mt{s}.google.com/vt/lyrs=y&apistyle=s.t%3A2%7Cp.v%3Aoff%2Cs.t%3A4%7Cp.v%3Aoff&x={x}&y={y}&z={z}',
        { subdomains: ['0', '1', '2', '3'], maxNativeZoom: 20, maxZoom: 21 }
      );
      leafletStreetLayer = L.tileLayer(
        'https://mt{s}.google.com/vt/lyrs=m&apistyle=s.t%3A2%7Cp.v%3Aoff%2Cs.t%3A4%7Cp.v%3Aoff&x={x}&y={y}&z={z}',
        { subdomains: ['0', '1', '2', '3'], maxNativeZoom: 20, maxZoom: 21 }
      );

      if (isSatelliteMode) {
        leafletSatLayer.addTo(leafletMap);
      } else {
        leafletStreetLayer.addTo(leafletMap);
      }

      leafletMap.on('click', () => {
        if (expandedClusterKey) {
          expandedClusterKey = null;
          renderLandmarkMarkers();
        }
        if (selectedPinId) {
          window.clearSelectedPin();
          if (window.AndroidBridge && window.AndroidBridge.onPinSelected) {
            window.AndroidBridge.onPinSelected('');
          }
        }
      });

      leafletMap.on('zoomend', () => {
        syncZoomLabels(leafletMap.getZoom());
        if (expandedClusterKey) renderLandmarkMarkers();
      });
      syncZoomLabels(leafletMap.getZoom());

      renderCampusGeometry();
      renderLandmarkMarkers();
      if (allLandmarkPins.length >= 2 && !selectedPinId) {
        fitAllCampusPins(false);
      }
      if (userLat !== null && userLng !== null) {
        drawOrUpdateUserMarker();
      }
      if (window.AndroidBridge && window.AndroidBridge.onMapEngineReady) {
        window.AndroidBridge.onMapEngineReady('leaflet');
      }
    }

    function drawOrUpdateUserMarker() {
      if (userLat === null || userLng === null) return;
      const clampedAcc = Math.min(Math.max(userAccuracy || 15, 5), 120);

      if (mapEngine === 'google' && googleMap) {
        const pos = { lat: userLat, lng: userLng };
        if (!googleUserAccuracyCircle) {
          googleUserAccuracyCircle = new google.maps.Circle({
            center: pos,
            radius: clampedAcc,
            strokeColor: '#0B57D0',
            strokeOpacity: 0.45,
            strokeWeight: 1,
            fillColor: '#0B57D0',
            fillOpacity: 0.14,
            clickable: false,
            map: googleMap
          });
        } else {
          googleUserAccuracyCircle.setCenter(pos);
          googleUserAccuracyCircle.setRadius(clampedAcc);
        }

        if (!googleUserMarker) {
          googleUserMarker = new google.maps.Marker({
            position: pos,
            map: googleMap,
            title: 'Your Live GPS Location',
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: 8.5,
              fillColor: '#0B57D0',
              fillOpacity: 1,
              strokeColor: '#FFFFFF',
              strokeWeight: 3
            },
            zIndex: 999
          });
        } else {
          googleUserMarker.setPosition(pos);
        }
      } else if (mapEngine === 'leaflet' && leafletMap) {
        const latLng = [userLat, userLng];
        if (!leafletUserAccuracyCircle) {
          leafletUserAccuracyCircle = L.circle(latLng, {
            radius: clampedAcc,
            color: '#0B57D0',
            weight: 1,
            opacity: 0.45,
            fillColor: '#0B57D0',
            fillOpacity: 0.14,
            interactive: false
          }).addTo(leafletMap);
        } else {
          leafletUserAccuracyCircle.setLatLng(latLng);
          leafletUserAccuracyCircle.setRadius(clampedAcc);
        }

        if (!leafletUserMarker) {
          const gpsIcon = L.divIcon({
            className: '',
            html: '<div class="gps-dot-wrapper"><div class="gps-dot-pulse"></div><div class="gps-dot-core"></div></div>',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });
          leafletUserMarker = L.marker(latLng, { icon: gpsIcon, interactive: false, zIndexOffset: 999 }).addTo(leafletMap);
        } else {
          leafletUserMarker.setLatLng(latLng);
        }
      }
      updateGuideLine();
    }

    let hasFitInitialPins = false;

    function fitAllCampusPins(animate = true) {
      if (!allLandmarkPins.length || mapEngine === 'pending') return;
      if (allLandmarkPins.length === 1) {
        const p = allLandmarkPins[0];
        if (mapEngine === 'google' && googleMap) {
          googleMap.panTo({ lat: p.lat, lng: p.lng });
          googleMap.setZoom(17);
        } else if (mapEngine === 'leaflet' && leafletMap) {
          leafletMap.setView([p.lat, p.lng], 17, { animate });
        }
        return;
      }
      if (mapEngine === 'google' && googleMap) {
        const b = new google.maps.LatLngBounds();
        allLandmarkPins.forEach(p => b.extend({ lat: p.lat, lng: p.lng }));
        googleMap.fitBounds(b, 64);
      } else if (mapEngine === 'leaflet' && leafletMap) {
        const b = L.latLngBounds(allLandmarkPins.map(p => [p.lat, p.lng]));
        if (b.isValid()) {
          leafletMap.fitBounds(b, { padding: [56, 56], maxZoom: 17, animate });
        }
      }
    }

    // --- Public JS Bridge API ---
    window.setLandmarkPins = function(pins) {
      if (typeof pins === 'string') {
        try { pins = JSON.parse(pins); } catch (_) { pins = []; }
      }
      allLandmarkPins = Array.isArray(pins) ? pins : [];
      renderLandmarkMarkers();
      if (!hasFitInitialPins && allLandmarkPins.length >= 2 && !selectedPinId) {
        hasFitInitialPins = true;
        fitAllCampusPins(false);
      }
    };

    window.filterLandmarkPins = function(categoryFilter, searchQuery) {
      activeCategoryFilter = categoryFilter || 'ALL';
      activeSearchQuery = (searchQuery || '').trim();
      renderLandmarkMarkers();
    };

    window.focusLandmarkPin = function(pinId) {
      selectedPinId = pinId;
      activeStepIndex = 0;
      const pin = allLandmarkPins.find(p => p.id === pinId);
      const visibleClusters = groupOverlappingPins(allLandmarkPins.filter(matchesActiveFilters), 6);
      expandedClusterKey = findClusterKeyForPin(visibleClusters, pinId);
      if (pin) {
        if (mapEngine === 'google' && googleMap) {
          googleMap.panTo({ lat: pin.lat, lng: pin.lng });
          googleMap.setZoom(18);
        } else if (mapEngine === 'leaflet' && leafletMap) {
          leafletMap.setView([pin.lat, pin.lng], 18, { animate: true });
        }
      }
      renderLandmarkMarkers();
      updateGuideLine();
    };

    window.setCustomRouteOrigin = function(lat, lng, label) {
      if (lat === null || lng === null || isNaN(lat) || isNaN(lng)) {
        customOrigin = null;
      } else {
        customOrigin = { lat: Number(lat), lng: Number(lng), label: label || 'Selected Start' };
      }
      activeStepIndex = 0;
      updateGuideLine();
    };

    window.highlightRouteStep = function(idx) {
      activeStepIndex = Number(idx) || 0;
      updateGuideLine();
      if (activeRouteData && activeRouteData.steps[activeStepIndex]) {
        const s = activeRouteData.steps[activeStepIndex];
        if (mapEngine === 'google' && googleMap) {
          googleMap.panTo(s.coord);
          googleMap.setZoom(20);
        } else if (mapEngine === 'leaflet' && leafletMap) {
          leafletMap.setView([s.coord.lat, s.coord.lng], 20, { animate: true });
        }
      }
    };

    window.clearSelectedPin = function() {
      selectedPinId = null;
      expandedClusterKey = null;
      activeStepIndex = 0;
      renderLandmarkMarkers();
      updateGuideLine();
    };

    window.updateUserLocation = function(lat, lng, accuracy) {
      userLat = lat;
      userLng = lng;
      userAccuracy = accuracy || 15;
      drawOrUpdateUserMarker();
      notifyBoundaryStatus();
    };

    window.recenterOnUser = function() {
      if (userLat === null || userLng === null) return;
      const status = evaluateCampusContainment(userLat, userLng);

      if (status.isInside) {
        if (mapEngine === 'google' && googleMap) {
          googleMap.panTo({ lat: userLat, lng: userLng });
          googleMap.setZoom(18);
        } else if (mapEngine === 'leaflet' && leafletMap) {
          leafletMap.setView([userLat, userLng], 18, { animate: true });
        }
      } else {
        window.recenterCampus();
        if (window.AndroidBridge && window.AndroidBridge.onOutsideCampusAlert) {
          window.AndroidBridge.onOutsideCampusAlert(status.distanceMeters);
        }
      }
    };

    window.recenterCampus = function() {
      if (allLandmarkPins.length >= 2) {
        fitAllCampusPins(true);
      } else if (mapEngine === 'google' && googleMap) {
        googleMap.panTo(BBSUTSD_CENTER);
        googleMap.setZoom(17);
      } else if (mapEngine === 'leaflet' && leafletMap) {
        leafletMap.setView([BBSUTSD_CENTER.lat, BBSUTSD_CENTER.lng], 17, { animate: true });
      }
    };

    window.setMapTypeMode = function(mode) {
      isSatelliteMode = (mode === 'satellite');
      if (mapEngine === 'google' && googleMap) {
        googleMap.setMapTypeId(isSatelliteMode ? google.maps.MapTypeId.HYBRID : google.maps.MapTypeId.ROADMAP);
      } else if (mapEngine === 'leaflet' && leafletMap) {
        if (isSatelliteMode) {
          if (leafletMap.hasLayer(leafletStreetLayer)) leafletMap.removeLayer(leafletStreetLayer);
          if (!leafletMap.hasLayer(leafletSatLayer)) leafletSatLayer.addTo(leafletMap);
        } else {
          if (leafletMap.hasLayer(leafletSatLayer)) leafletMap.removeLayer(leafletSatLayer);
          if (!leafletMap.hasLayer(leafletStreetLayer)) leafletStreetLayer.addTo(leafletMap);
        }
      }
      renderCampusGeometry();
    };

    window.zoomInMap = function() {
      if (mapEngine === 'google' && googleMap) {
        googleMap.setZoom(Math.min(21, (googleMap.getZoom() || 17) + 1));
      } else if (mapEngine === 'leaflet' && leafletMap) {
        leafletMap.zoomIn();
      }
    };

    window.zoomOutMap = function() {
      if (mapEngine === 'google' && googleMap) {
        googleMap.setZoom(Math.max(15, (googleMap.getZoom() || 17) - 1));
      } else if (mapEngine === 'leaflet' && leafletMap) {
        leafletMap.zoomOut();
      }
    };

    (function bootstrap() {
      fetchVerifiedOsmCampusGeometry();

      const params = new URLSearchParams(window.location.search);
      const apiKey = params.get('apiKey') || '';

      if (apiKey) {
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&callback=initGoogleMaps`;
        script.async = true;
        script.defer = true;
        script.onerror = function() { initLeafletMap(); };
        document.head.appendChild(script);

        setTimeout(() => {
          if (mapEngine === 'pending') initLeafletMap();
        }, 3500);
      } else {
        initLeafletMap();
      }
    })();
  </script>
</body>
</html>
